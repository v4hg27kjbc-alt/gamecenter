<style>
:root {
  --glass-bg: rgba(255, 255, 255, 0.07);
  --glass-border: rgba(255, 255, 255, 0.13);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  --accent: #4fc3f7;
  --accent-glow: rgba(79, 195, 247, 0.45);
  --text: #e0e0e0;
  --text-dim: #9e9e9e;
  --card-hover-bg: rgba(255, 255, 255, 0.11);
}

/* ===== 浅色模式变量覆盖 ===== */
body.light-mode {
  --glass-bg: rgba(0, 0, 0, 0.04);
  --glass-border: rgba(0, 0, 0, 0.10);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
  --accent: #1565c0;
  --accent-glow: rgba(21, 101, 192, 0.30);
  --text: #1a1a2e;
  --text-dim: #666;
  --card-hover-bg: rgba(0, 0, 0, 0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: linear-gradient(160deg, #0a1220 0%, #0e1a2e 35%, #162840 65%, #0c1628 100%);
  background-attachment: fixed;
  min-height: 100vh;
  color: var(--text);
  overflow-x: hidden;
  transition: background 0.4s ease, color 0.4s ease;
}
body.light-mode {
  background: linear-gradient(160deg, #e8edf5 0%, #f0f4f8 35%, #e4eaf2 65%, #e8edf5 100%);
  color: var(--text);
}

.stars-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  transition: opacity 0.4s ease;
}
body.light-mode .stars-layer { opacity: 0; }
.star {
  position: absolute; background: white; border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  animation-delay: var(--delay);
}
@keyframes twinkle {
  0%, 100% { opacity: 0.15; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.9); }
}

.app-container {
  position: relative; z-index: 1;
  max-width: 1340px; margin: 0 auto; padding: 36px 20px 60px;
}

.header {
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 40px 40px 32px;
  margin-bottom: 32px;
  box-shadow: var(--glass-shadow);
  text-align: center;
  position: relative;
  animation: fadeInDown 0.6s ease;
  transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
.header h1 {
  font-size: 2.8rem; font-weight: 700;
  background: linear-gradient(135deg, #e3f2fd, #81d4fa, #e3f2fd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px; margin-bottom: 6px;
}
body.light-mode .header h1 {
  background: linear-gradient(135deg, #1a1a2e, #1565c0, #1a1a2e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .subtitle {
  color: var(--text-dim); font-size: 0.9rem;
  letter-spacing: 5px; text-transform: uppercase;
}

/* ===== 深色/浅色模式切换按钮 ===== */
.theme-toggle {
  position: absolute; top: 20px; right: 24px; z-index: 10;
  width: 42px; height: 42px;
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--glass-shadow);
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  color: var(--text);
  font-size: 1.25rem;
  padding: 0;
}
.theme-toggle:hover {
  background: var(--card-hover-bg);
  border-color: rgba(255,255,255,0.32);
  transform: scale(1.08);
  box-shadow: 0 6px 24px rgba(0,0,0,0.35), 0 0 16px var(--accent-glow);
}
body.light-mode .theme-toggle:hover {
  border-color: rgba(0,0,0,0.18);
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.theme-toggle:active { transform: scale(0.92); }

/* —— 图标旋转弹出动画 —— */
@keyframes iconSpinIn {
  0%   { transform: rotate(0deg) scale(0.3); opacity: 0; }
  100% { transform: rotate(360deg) scale(1); opacity: 1; }
}
.theme-toggle.no-animate svg { transition: none; }
.theme-toggle.anim-icon svg { animation: iconSpinIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

/* 长按视觉反馈 */
.theme-toggle.long-pressing { transform: scale(1.12); box-shadow: 0 0 22px var(--accent-glow); }

.theme-toggle svg {
  width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
  transition: transform 0.4s ease, opacity 0.3s ease;
}

/* ===== 主题选择弹窗 ===== */
.theme-modal-overlay {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(10, 18, 32, 0.55);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  display: flex; align-items: center; justify-content: center;
  animation: themeModalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes themeModalIn {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}
.theme-modal-overlay.fade-out {
  animation: themeModalOut 0.3s ease forwards;
}
@keyframes themeModalOut {
  from { opacity: 1; transform: scale(1); }
  to   { opacity: 0; transform: scale(0.95); }
}
.theme-modal-card {
  position: relative;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 36px;
  max-width: 440px; width: 90%;
  box-shadow: var(--glass-shadow);
  text-align: center;
  color: var(--text);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
}
.theme-modal-card h3 {
  font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.5px;
}
.theme-modal-card .modal-sub {
  font-size: 0.88rem; color: var(--text-dim); margin-bottom: 28px; line-height: 1.5;
}
.theme-modal-choices {
  display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
}
.theme-modal-btn {
  flex: 1; min-width: 140px; padding: 14px 20px;
  border-radius: 14px; border: 2px solid transparent;
  cursor: pointer; font-size: 0.95rem; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
  color: inherit;
}
.theme-modal-btn:hover { transform: scale(1.05); }
.theme-modal-btn:active { transform: scale(0.96); }
.theme-modal-btn.dark-btn {
  background: #0a1220; color: #e3f2fd; border-color: rgba(255,255,255,0.15);
}
.theme-modal-btn.light-btn {
  background: #e8edf5; color: #1a1a2e; border-color: rgba(0,0,0,0.1);
}
.theme-modal-close {
  position: absolute; top: 12px; right: 14px;
  width: 32px; height: 32px;
  background: none; border: none;
  font-size: 1.5rem; color: var(--text-dim);
  cursor: pointer; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease; line-height: 1;
}
.theme-modal-close:hover {
  background: var(--glass-bg); color: var(--text);
}

/* ===== 热门排行 ===== */
.ranking-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px); z-index: 10000;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.ranking-modal {
  background: #0d1520; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 28px 24px; width: 440px; max-height: 80vh;
  overflow-y: auto; position: relative;
  box-shadow: 0 24px 60px rgba(0,0,0,0.5);
}
.ranking-modal h2 {
  margin: 0 0 6px 0; font-size: 18px; color: #e0e0e0;
  display: flex; align-items: center; gap: 8px;
}
.ranking-modal .ranking-subtitle {
  font-size: 12px; color: #607d8b; margin-bottom: 16px;
}
.ranking-close {
  position: absolute; top: 16px; right: 18px;
  width: 32px; height: 32px; background: none; border: none;
  font-size: 1.4rem; color: #78909c; cursor: pointer;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.ranking-close:hover { background: rgba(255,255,255,0.08); color: #fff; }
.ranking-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  transition: background 0.15s; margin-bottom: 6px;
}
.ranking-item:hover { background: rgba(255,255,255,0.05); }
.ranking-rank {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
  background: rgba(255,255,255,0.08); color: #78909c;
}
.ranking-rank.gold { background: linear-gradient(135deg, #f9a825, #f57f17); color: #fff; }
.ranking-rank.silver { background: linear-gradient(135deg, #90a4ae, #607d8b); color: #fff; }
.ranking-rank.bronze { background: linear-gradient(135deg, #8d6e63, #5d4037); color: #fff; }
.ranking-thumb {
  width: 44px; height: 32px; border-radius: 6px; object-fit: cover;
  background: #1a2a3a; flex-shrink: 0;
}
.ranking-info { flex: 1; min-width: 0; }
.ranking-name { font-size: 14px; font-weight: 600; color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ranking-code { font-size: 11px; color: #607d8b; }
.ranking-count { font-size: 13px; color: #ffb74d; font-weight: 600; flex-shrink: 0; }
.ranking-empty {
  text-align: center; padding: 32px 0; color: #607d8b; font-size: 14px;
}
.ranking-clear {
  text-align: right; margin-top: 8px; font-size: 11px;
}
.ranking-clear a {
  color: #546e7a; cursor: pointer; text-decoration: none;
  transition: color 0.15s;
}
.ranking-clear a:hover { color: #e57373; }

/* ===== 冷知识弹幕 ===== */
.cold-fact-toast {
  position: fixed; z-index: 9999;
  bottom: 90px; right: -100%;
  max-width: 420px; padding: 10px 16px;
  background: rgba(13, 21, 32, 0.92); border: 1px solid rgba(255, 152, 0, 0.4);
  border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  color: #e0e0e0; font-size: 13px; line-height: 1.5;
  pointer-events: none; white-space: nowrap;
  animation: coldFactSlide 16s linear;
}
.cold-fact-toast::before {
  content: '✈ 冷知识';
  display: block; font-size: 10px; color: #ff9800;
  margin-bottom: 2px; letter-spacing: 1px;
}
@keyframes coldFactSlide {
  0%   { right: -100%; }
  5%   { right: 10px; }
  85%  { right: 10px; }
  100% { right: -100%; }
}

/* ===== 统计面板 ===== */
.stats-panel {
  display: flex; gap: 14px; flex-wrap: wrap;
  margin-bottom: 24px; justify-content: center;
}
.stat-card {
  flex: 1; min-width: 140px; max-width: 200px;
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  padding: 18px 16px;
  text-align: center;
  box-shadow: var(--glass-shadow);
  transition: transform 0.3s ease, background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
}
.stat-card:hover {
  transform: translateY(-3px);
  background: var(--card-hover-bg);
  border-color: rgba(255,255,255,0.25);
}
.stat-card .stat-icon {
  font-size: 1.6rem; margin-bottom: 6px;
}
.stat-card .stat-number {
  font-size: 1.8rem; font-weight: 700; color: #fff;
  letter-spacing: 0.5px;
  font-variant-numeric: tabular-nums;
}
body.light-mode .stat-card .stat-number { color: #1a1a2e; }
.stat-card .stat-label {
  font-size: 0.72rem; color: var(--text-dim);
  letter-spacing: 1px; text-transform: uppercase; margin-top: 2px;
}
@media (max-width: 768px) {
  .stats-panel { gap: 8px; }
  .stat-card { min-width: 100px; padding: 14px 10px; }
  .stat-card .stat-number { font-size: 1.4rem; }
  .stat-card .stat-icon { font-size: 1.3rem; }
}

/* ===== 标题淡入动画 ===== */
.title-fade-in {
  opacity: 0;
  transform: translateY(-20px);
  animation: titleFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes titleFadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Hero Banner 全幅轮播 ===== */
.hero-banner {
  position: relative;
  width: 100%;
  height: 400px;
  margin-bottom: 32px;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--glass-shadow);
  border: 1px solid var(--glass-border);
}
.hero-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1s ease-in-out;
  display: flex;
  pointer-events: none;
}
.hero-slide.active {
  opacity: 1;
  pointer-events: auto;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: brightness(0.65);
  transform: scale(1.02);
  transition: transform 6s ease;
}
.hero-slide.active .hero-bg {
  transform: scale(1);
}
.hero-content {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: stretch;
  width: 100%;
  height: 100%;
}
.hero-text {
  width: 45%;
  min-width: 340px;
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  background: rgba(10, 18, 36, 0.55);
  border-right: 1px solid rgba(255,255,255,0.08);
  padding: 48px 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  transition: background 0.4s ease, border-color 0.4s ease;
}

/* ===== 卡片淡入上升动画 (IntersectionObserver + CSS) ===== */
.card-animate {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
}
.card-visible {
  opacity: 1;
  transform: translateY(0);
}
.card {
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  overflow: hidden; cursor: pointer;
  transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
  /* card-animate + card-visible triggered by IntersectionObserver */
  display: flex; flex-direction: column;
  transition: transform 0.3s ease, background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
}
.card:hover {
  transform: translateY(-7px) scale(1.015);
  background: var(--card-hover-bg);
  border-color: rgba(255,255,255,0.32);
  box-shadow: 0 14px 44px rgba(0, 0, 0, 0.4), 0 0 28px var(--accent-glow);
}
body.light-mode .card:hover {
  border-color: rgba(0,0,0,0.18);
  box-shadow: 0 10px 36px rgba(0,0,0,0.12), 0 0 24px var(--accent-glow);
}
.card:active { transform: scale(0.97); }

  position: relative; width: 100%; height: 200px; overflow: hidden;
  background: linear-gradient(180deg, rgba(10,18,36,0.3), rgba(10,18,36,0.85));
}

}
.card:hover .card-image-wrap img { transform: scale(1.05); transition: transform 0.3s ease; }
.card-image-wrap::after {

  border: 1px solid rgba(79, 195, 247, 0.25);
  border-radius: 20px;
  padding: 6px 16px;
  transition: all 0.3s ease;
  cursor: pointer;
}
.airline-website:hover {
  background: rgba(79, 195, 247, 0.22);
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
  transform: translateY(-1px);
}
.airline-website svg { width: 13px; height: 13px; }

@media (max-width: 768px) {
  .header { padding: 28px 18px; }
  .header h1 { font-size: 1.9rem; }
  .grid { grid-template-columns: 1fr; gap: 18px; }
  .detail-modal { width: 96%; max-height: 92vh; }
  .modal-specs { grid-template-columns: 1fr; }
  .airline-card { flex-direction: column; align-items: center; text-align: center; }
  .airline-logo { width: 44px; height: 44px; }
}
.announcement-toast {
  position: fixed; top: -80px; left: 50%; transform: translateX(-50%); z-index: 200;
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  background: rgba(79, 195, 247, 0.18);
  border: 1px solid rgba(79, 195, 247, 0.35);
  border-radius: 16px;
  padding: 14px 28px;
  color: #fff; font-size: 0.9rem; font-weight: 600;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 20px rgba(79, 195, 247, 0.3);
  display: flex; align-items: center; gap: 10px;
  transition: top 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}
.announcement-toast.show { top: 24px; }
.announcement-toast .toast-icon {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(79, 195, 247, 0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem;
}
.announcement-toast .toast-close {
  margin-left: 8px; cursor: pointer;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; border: none; color: #fff;
  transition: background 0.3s;
}
.announcement-toast .toast-close:hover { background: rgba(255,255,255,0.25); }
body.light-mode .announcement-toast {
  background: rgba(21,101,192,0.08);
  border-color: rgba(21,101,192,0.25);
  color: #1a1a2e;
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}
body.light-mode .announcement-toast .toast-close { background: rgba(0,0,0,0.08); color: #555; }
body.light-mode .announcement-toast .toast-close:hover { background: rgba(0,0,0,0.15); }

/* ===== 更新通知横幅 ===== */
.update-banner {
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  background: rgba(15, 30, 60, 0.9);
  border-left: 4px solid #42a5f5;
  border-radius: 16px 16px 0 0;
  padding: 14px 48px 14px 20px;
  margin-bottom: 20px;
  color: #e0e0e0;
  font-size: 0.88rem;
  line-height: 1.7;
  position: relative;
  display: none;
  animation: bannerFadeInDown 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
body.light-mode .update-banner {
  background: rgba(255,255,255,0.88);
  color: #333;
  border-left-color: #1565c0;
}
.update-banner.visible { display: block; }
@keyframes bannerFadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
.update-banner .banner-highlight {
  color: #42a5f5;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.update-banner .banner-sep {
  color: rgba(255,255,255,0.25);
  margin: 0 10px;
}
.update-banner .banner-close {
  position: absolute;
  top: 50%;
  right: 14px;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  cursor: pointer;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s;
}
.update-banner .banner-close:hover {
  background: rgba(255,255,255,0.25);
}

/* ===== 搜索栏 ===== */
.search-sort-row {
  display: flex; gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px; align-items: center; justify-content: center;
}
.search-wrap {
  position: relative; flex: 1; min-width: 220px; max-width: 400px;
}
.search-wrap svg {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  width: 17px; height: 17px; stroke: var(--text-dim); fill: none; stroke-width: 2;
  pointer-events: none; transition: stroke 0.3s;
}
.search-input {
  width: 100%; padding: 11px 18px 11px 44px;
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  color: #fff; font-size: 0.88rem; outline: none;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  font-family: inherit;
}
body.light-mode .search-input {
  color: #1a1a2e;
}
body.light-mode .search-input::placeholder { color: #999; }
.search-input::placeholder { color: var(--text-dim); }
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 22px var(--accent-glow); }
  50% { box-shadow: 0 0 36px var(--accent-glow), 0 0 60px rgba(79,195,247,0.2); }
}
.search-input:focus {
  border-color: var(--accent);
  animation: glowPulse 2s ease-in-out infinite;
  background: rgba(255,255,255,0.11);
}
.search-input:focus + svg,
.search-wrap:focus-within svg { stroke: var(--accent); }
.search-clear {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: none; color: var(--text-dim);
  cursor: pointer; font-size: 0.8rem; display: none;
  align-items: center; justify-content: center; transition: all 0.3s;
}
.search-clear.visible { display: flex; }
.search-clear:hover { background: rgba(255,255,255,0.2); color: #fff; }
.search-results-hint {
  color: var(--text-dim); font-size: 0.78rem; text-align: center;
  margin-bottom: 14px; display: none;
}

/* ===== 搜索建议下拉 ===== */
.suggestions-dropdown {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  background: rgba(18, 28, 46, 0.95);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 6px 0;
  display: none;
  z-index: 100;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  animation: suggestIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
body.light-mode .suggestions-dropdown {
  background: rgba(255,255,255,0.95);
  border: 1px solid rgba(0,0,0,0.1);
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
body.light-mode .suggestion-name { color: #1a1a2e; }
body.light-mode .suggestion-item:hover { background: rgba(21,101,192,0.08); }
@keyframes suggestIn {
  from { opacity: 0; transform: translateY(-6px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.suggestions-dropdown.visible { display: block; }
.suggestion-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  cursor: pointer;
  transition: background 0.2s;
}
.suggestion-item:hover {
  background: rgba(79, 195, 247, 0.12);
}
.suggestion-item:first-child { border-radius: 12px 12px 0 0; }
.suggestion-item:last-child { border-radius: 0 0 12px 12px; }
.suggestion-thumb {
  width: 30px; height: 20px; border-radius: 4px;
  object-fit: cover; flex-shrink: 0;
  background: rgba(255,255,255,0.06);
}
.suggestion-info { display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
.suggestion-name {
  font-size: 0.85rem; color: #fff; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.suggestion-code {
  font-size: 0.72rem; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ===== 排序按钮组 ===== */
.sort-group {
  display: flex; gap: 6px; flex-shrink: 0;
}
.sort-chip {
  backdrop-filter: blur(10px) saturate(180%);
  -webkit-backdrop-filter: blur(10px) saturate(180%);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  padding: 8px 16px;
  color: var(--text-dim); cursor: pointer; font-size: 0.78rem;
  transition: all 0.3s ease; user-select: none; white-space: nowrap;
  display: flex; align-items: center; gap: 4px;
}
.sort-chip:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
body.light-mode .sort-chip:hover { color: #1a1a2e; border-color: rgba(0,0,0,0.25); }
.sort-chip.active {
  background: rgba(79, 195, 247, 0.18);
  border-color: var(--accent); color: var(--accent);
}
.sort-arrow { font-size: 0.65rem; transition: transform 0.3s; display: inline-block; }
.sort-chip.desc .sort-arrow { transform: rotate(180deg); }

/* ===== 卡片对比复选框 ===== */
.card-compare-check {
  position: absolute; top: 12px; right: 52px; z-index: 3;
  width: 28px; height: 28px;
  backdrop-filter: blur(8px);
  background: rgba(0,0,0,0.4);
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease; opacity: 0; transform: scale(0.8);
}
.card:hover .card-compare-check,
.card-compare-check.checked { opacity: 1; transform: scale(1); }
.card-compare-check.checked {
  background: rgba(79, 195, 247, 0.3);
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.card-compare-check svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2.5; }
.card-compare-check.checked svg { fill: var(--accent); stroke: var(--accent); }

/* ===== 对比面板 ===== */
.compare-bar {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 90;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  background: rgba(18, 28, 46, 0.85);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 14px 24px;
  display: none; align-items: center; gap: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 24px var(--accent-glow);
  animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
body.light-mode .compare-bar {
  background: rgba(255,255,255,0.88);
  box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 0 20px var(--accent-glow);
}
.compare-bar.visible { display: flex; }
@keyframes slideUp {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.compare-bar .compare-slot {
  backdrop-filter: blur(8px);
  background: rgba(255,255,255,0.05);
  border: 1px dashed rgba(255,255,255,0.18);
  border-radius: 12px;
  padding: 8px 16px;
  font-size: 0.82rem; color: var(--text-dim);
  min-width: 140px; text-align: center;
}
.compare-bar .compare-slot.filled {
  border-style: solid; border-color: var(--accent);
  background: rgba(79, 195, 247, 0.1);
  color: #fff; font-weight: 600;
}
.compare-bar .compare-vs { color: var(--accent); font-weight: 700; font-size: 0.9rem; }
.compare-bar .compare-btn {
  backdrop-filter: blur(8px);
  background: rgba(79, 195, 247, 0.2);
  border: 1px solid var(--accent);
  border-radius: 50px;
  padding: 8px 22px; color: #fff; font-size: 0.85rem; font-weight: 600;
  cursor: pointer; transition: all 0.3s ease; white-space: nowrap;
}
.compare-bar .compare-btn:hover:not(:disabled) {
  background: rgba(79, 195, 247, 0.35);
  box-shadow: 0 0 18px var(--accent-glow);
}
.compare-bar .compare-btn:disabled { opacity: 0.35; cursor: default; }
.compare-bar .compare-clear {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 0.8rem; transition: color 0.3s;
}
.compare-bar .compare-clear:hover { color: #ff5252; }

/* ===== 对比模态 ===== */
.compare-modal {
  backdrop-filter: blur(26px) saturate(180%);
  -webkit-backdrop-filter: blur(26px) saturate(180%);
  background: rgba(18, 28, 46, 0.82);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  width: 94%; max-width: 900px; max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 40px var(--accent-glow);
  animation: modalSlideIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}
body.light-mode .compare-modal {
  background: rgba(255,255,255,0.86);
  box-shadow: 0 12px 48px rgba(0,0,0,0.15), 0 0 30px var(--accent-glow);
}
body.light-mode .compare-modal .compare-header h2 { color: #1a1a2e; }
.compare-modal .compare-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 28px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.compare-modal .compare-header h2 { color: #fff; font-size: 1.3rem; }
.compare-modal .compare-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
}
.compare-col {
  padding: 24px 28px;
}
.compare-col:first-child { border-right: 1px solid rgba(255,255,255,0.06); }
.compare-col .compare-img {
  width: 100%; height: 180px; object-fit: cover; border-radius: 14px;
  margin-bottom: 16px;
}
.compare-col h3 { color: #fff; font-size: 1.15rem; margin-bottom: 4px; }
.compare-col .compare-code { color: var(--accent); font-size: 0.78rem; letter-spacing: 2px; margin-bottom: 10px; }
.compare-col .compare-desc { color: var(--text-dim); font-size: 0.83rem; line-height: 1.55; margin-bottom: 14px; }
.compare-spec-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
}
.compare-spec-row .spec-label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
.compare-spec-row .spec-value { font-size: 0.95rem; color: #fff; font-weight: 700; }
.compare-spec-row .spec-value.better { color: #69f0ae; }

/* ===== 骨架屏 ===== */
.skeleton-img {
  position: absolute; inset: 0; z-index: 5;
  background: linear-gradient(180deg, rgba(10,18,36,0.5), rgba(10,18,36,0.9));
  overflow: hidden;
}
.skeleton-img::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
  animation: shimmer 1.6s ease-in-out infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.skeleton-img.hidden { display: none; }
.card-image-wrap img.loaded { opacity: 1; }
.card-image-wrap img {
  opacity: 0; transition: opacity 0.5s ease;
}

/* ===== 3D 倾斜效果 ===== */
.card.tilt-active {
  transition: transform 0.1s ease-out, background 0.45s cubic-bezier(0.16, 1, 0.3, 1),
              border-color 0.45s, box-shadow 0.45s;
  transform-style: preserve-3d;
  perspective: 800px;
}
.card.tilt-active:hover { transform: none; }
.card.tilt-active .card-image-wrap,
.card.tilt-active .card-body {
  transform-style: preserve-3d;
}

/* ===== 返回顶部按钮 ===== */
.back-to-top {
  position: fixed; bottom: 32px; right: 28px; z-index: 80;
  width: 46px; height: 46px;
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  background: rgba(79, 195, 247, 0.15);
  border: 1px solid rgba(79, 195, 247, 0.3);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: translateY(20px);
  pointer-events: none;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
@keyframes bounceIn {
  0% { opacity: 0; transform: translateY(20px) scale(0.8); }
  50% { transform: translateY(-8px) scale(1.05); }
  70% { transform: translateY(3px) scale(0.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.back-to-top.visible {
  opacity: 1; transform: translateY(0); pointer-events: auto;
  animation: bounceIn 0.5s ease;
}
.back-to-top:hover {
  background: rgba(79, 195, 247, 0.3);
  border-color: var(--accent);
  box-shadow: 0 6px 24px rgba(79, 195, 247, 0.4);
  transform: translateY(-3px);
}
body.light-mode .back-to-top {
  background: rgba(21,101,192,0.08);
  border-color: rgba(21,101,192,0.2);
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
body.light-mode .back-to-top:hover {
  background: rgba(21,101,192,0.16);
  box-shadow: 0 4px 18px rgba(21,101,192,0.3);
}
.back-to-top svg {
  width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 2.5;
}

/* ===== 快捷添加悬浮按钮 ===== */
.fab-add {
  position: fixed; bottom: 96px; right: 27px; z-index: 999;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  opacity: 0.85;
}
.fab-add:hover {
  opacity: 1;
  transform: scale(1.1);
  box-shadow: 0 6px 28px rgba(102, 126, 234, 0.55);
}
.fab-add svg {
  width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.5;
}

/* ===== 添加模态窗口 ===== */
.add-modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.add-modal-overlay.show {
  opacity: 1; pointer-events: auto;
}
.add-modal {
  background: linear-gradient(145deg, #1e2a3a, #1a2332);
  border: 1px solid rgba(79, 195, 247, 0.2);
  border-radius: 18px;
  padding: 32px;
  width: 90vw; max-width: 680px; max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  position: relative;
  color: #e0e0e0;
}
.add-modal h2 {
  margin: 0 0 8px 0;
  font-size: 1.4rem;
  background: linear-gradient(135deg, #4fc3f7, #7c4dff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.add-modal .modal-subtitle {
  font-size: 0.82rem; color: #8899aa; margin-bottom: 24px;
}
.add-modal .form-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  margin-bottom: 16px;
}
.add-modal .form-row.single {
  grid-template-columns: 1fr;
}
.add-modal .form-group {
  display: flex; flex-direction: column; gap: 5px;
}
.add-modal .form-group label {
  font-size: 0.78rem; font-weight: 600; color: #aab8c5;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.add-modal .form-group input,
.add-modal .form-group textarea,
.add-modal .form-group select {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06);
  color: #e0e0e0;
  font-size: 0.9rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.add-modal .form-group input:focus,
.add-modal .form-group textarea:focus,
.add-modal .form-group select:focus {
  border-color: #4fc3f7;
  box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.15);
}
.add-modal .form-group textarea {
  min-height: 80px; resize: vertical;
}
.add-modal .form-group select {
  cursor: pointer;
}
.add-modal .form-group select option {
  background: #1e2a3a; color: #e0e0e0;
}
.add-modal .airline-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.add-modal .airline-chip {
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  color: #aab8c5;
}
.add-modal .airline-chip.selected {
  background: rgba(79, 195, 247, 0.2);
  border-color: #4fc3f7;
  color: #4fc3f7;
}
.add-modal .btn-row {
  display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;
}
.add-modal .btn-submit {
  padding: 11px 28px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}
.add-modal .btn-submit:hover {

}
.add-modal .btn-cancel {
  padding: 11px 24px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.15);

  font-size: 0.92rem;

  transition: all 0.25s;
}
.add-modal .btn-cancel:hover {
  background: rgba(255,255,255,0.06);

/* ===== 浅色模式: add-modal ===== */
body.light-mode .add-modal .form-group input,
body.light-mode .add-modal .form-group textarea,
body.light-mode .add-modal .form-group select {

}
body.light-mode .add-modal .btn-cancel { border-color: rgba(0,0,0,0.15); color: #666; }
body.light-mode .add-modal .btn-cancel:hover { background: rgba(0,0,0,0.05); color: #333; }
body.light-mode .add-modal h2,
body.light-mode .add-modal .modal-subtitle { color: #1a1a2e; }
body.light-mode .add-modal .form-group label { color: #555; }
body.light-mode .add-modal .airline-chip { border-color: rgba(0,0,0,0.12); color: #666; background: rgba(0,0,0,0.03); }
body.light-mode .add-modal .airline-chip.selected { background: rgba(21,101,192,0.12); border-color: #1565c0; color: #1565c0; }
body.light-mode .add-modal .form-group select option { background: #fff; color: #1a1a2e; }

.card .custom-delete-btn {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(244, 67, 54, 0.9);
  color: #fff;
  font-size: 0.72rem;
  text-align: center;
  padding: 4px 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  cursor: pointer;
  z-index: 6;
}
.card.custom-mode .custom-delete-btn {
  opacity: 1;
  pointer-events: auto;
}

/* ===== 移动端适配 ===== */
@media (max-width: 768px) {
  .search-sort-row { flex-direction: column; gap: 10px; }
  .search-wrap { max-width: 100%; }
  .sort-group { justify-content: center; width: 100%; }
  .sort-chip { padding: 7px 12px; font-size: 0.72rem; }
  .compare-modal .compare-grid { grid-template-columns: 1fr; }
  .compare-col:first-child { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .compare-bar { flex-wrap: wrap; justify-content: center; padding: 12px 16px; }
  .back-to-top { bottom: 20px; right: 16px; width: 40px; height: 40px; }
  .card-compare-check { opacity: 1; transform: scale(1); }
  .fab-add { bottom: 78px; right: 15px; width: 40px; height: 40px; }
  .fab-add svg { width: 20px; height: 20px; }
  .add-modal { padding: 20px; width: 95vw; }
  .add-modal .form-row { grid-template-columns: 1fr; }
}

/* ===== P3: 骨架屏占位卡片 ===== */
.skeleton-card {
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
  display: flex; flex-direction: column;
}
.skeleton-card .skel-img {
  width: 100%; height: 200px;
  background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
  background-size: 200% 100%;
  animation: skelShimmer 1.5s ease-in-out infinite;
}
.skeleton-card .skel-body { padding: 18px 20px 20px; }
.skeleton-card .skel-line {
  height: 14px; border-radius: 7px; margin-bottom: 10px;
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%;
  animation: skelShimmer 1.5s ease-in-out infinite;
}
.skeleton-card .skel-line.short { width: 50%; }
.skeleton-card .skel-line.medium { width: 72%; }
.skeleton-card .skel-stats {
  display: flex; gap: 16px; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.skeleton-card .skel-stat { flex: 1; }
@keyframes skelShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
/* ===== P4: 相关推荐 ===== */
.related-section { margin-top: 8px; }
.related-section h3 {
  font-size: 1rem; color: var(--accent); margin-bottom: 14px;
  letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
}
.related-section h3::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(255,255,255,0.08);
}
.related-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
@media (max-width: 500px) {
  .related-grid { grid-template-columns: repeat(2, 1fr); }
}
.related-card {
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  overflow: hidden; cursor: pointer;
  transition: all 0.3s ease;
}
.related-card:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.22);
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.related-card-img {
  width: 100%; height: 100px; object-fit: cover; display: block;
  background: rgba(10,18,36,0.6);
}
.related-card-name {
  padding: 8px 10px; font-size: 0.78rem; color: #ccc;
  text-align: center; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== P2: 大图预览 Lightbox ===== */
.image-lightbox {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  animation: overlayIn 0.25s ease;
  cursor: zoom-out;
}
.image-lightbox img {
  max-width: 92vw; max-height: 90vh;
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 8px 50px rgba(0,0,0,0.6);
  cursor: default;
  transition: transform 0.15s ease;
  user-select: none;
  -webkit-user-drag: none;
}
.lightbox-spinner {
  width: 48px; height: 48px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dicePop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
@keyframes diceShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes diceGlow { 0%,100% { text-shadow: 0 0 20px rgba(79,195,247,0.3); } 50% { text-shadow: 0 0 40px rgba(79,195,247,0.8), 0 0 80px rgba(79,195,247,0.4); } }
.dice-overlay {
  position: fixed; z-index: 400; inset: 0;
  background: rgba(5,10,22,0.92);
  display: flex; align-items: center; justify-content: center;
  animation: dicePop 0.3s ease-out;
}
.dice-box { text-align: center; }
.dice-rolling {
  font-size: 3rem; font-weight: 700; color: var(--text);
  min-height: 4rem; transition: all 0.1s;
  animation: diceShake 0.1s infinite;
}
.dice-rolling.dice-done {
  animation: diceGlow 0.6s ease-in-out;
  font-size: 3.5rem; color: var(--accent);
}
.dice-hint { color: var(--text-dim); margin-top: 16px; font-size: 1rem; }
@media (max-width: 640px) {
  .dice-rolling { font-size: 1.6rem; }
  .dice-rolling.dice-done { font-size: 2rem; }
}
.lightbox-close {
  position: absolute; top: 24px; right: 28px;
  width: 44px; height: 44px;
  backdrop-filter: blur(8px);
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  color: #fff; font-size: 1.4rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease; z-index: 2;
}
.lightbox-close:hover { background: rgba(255,255,255,0.15); transform: rotate(90deg); }
.lightbox-zoom-hint {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.45); font-size: 0.78rem;
  pointer-events: none;
  transition: opacity 0.5s ease;
}


/* ===== 滚动进度条 ===== */
.scroll-progress {
  position: fixed; top: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, #29b6f6, #0288d1, #4fc3f7);
  z-index: 99999;
  width: 0;
  transition: width 0.1s linear;
}

/* ===== 导出收藏按钮 ===== */
.modal-action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
  background: rgba(255,255,255,0.08); color: #ccc;
}
.modal-action-btn:hover {
  background: rgba(255,255,255,0.15); color: #fff;
  border-color: rgba(255,255,255,0.25);
}

/* ===== 视图切换按钮 ===== */
.view-switch-bar {
  display: inline-flex;
  margin-left: auto;
}
.view-switch-btn {
  padding: 6px 16px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  border-radius: 20px;
  transition: all 0.25s;
  font-family: inherit;
  white-space: nowrap;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.view-switch-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.view-switch-btn:hover:not(.active) {
  color: var(--text-primary);
  background: var(--hover-bg);
}

/* ===== 时间线容器 ===== */
#timeline {
  position: relative;
  padding: 60px 0 40px;
  max-width: 900px;
  margin: 0 auto;
}

/* 时间线竖线 */
#timeline::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--accent);
  transform: translateX(-50%);
  opacity: 0.4;
}

/* 时间线条目 */
.tl-item {
  position: relative;
  display: flex;
  align-items: flex-start;
  margin-bottom: 48px;
  width: 100%;
}

.tl-item.tl-left {
  justify-content: flex-start;
  padding-right: calc(50% + 40px);
}
.tl-item.tl-right {
  justify-content: flex-end;
  padding-left: calc(50% + 40px);
}

/* 时间线卡片 */
.tl-card {
  width: 100%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 14px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  align-items: center;
  gap: 14px;
  max-width: 380px;
}
.tl-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(0,0,0,0.3);
  border-color: var(--accent);
}
.tl-card-img {
  width: 80px;
  height: 56px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255,255,255,0.05);
}
.tl-card-info {
  flex: 1;
  min-width: 0;
}
.tl-card-name {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tl-card-meta {
  font-size: 0.78rem;
  color: var(--text-secondary);
  display: flex;
  gap: 8px;
  align-items: center;
}
.tl-card-mfr {
  color: var(--accent);
  font-weight: 500;
}

/* 时间线节点 */
.tl-dot {
  position: absolute;
  left: 50%;
  top: 20px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  transform: translate(-50%, 0);
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 4px var(--bg-color), 0 0 12px rgba(0,168,232,0.4);
}
.tl-year {
  position: absolute;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  top: 50%;
  transform: translateY(-50%);
}
.tl-left .tl-year {
  right: 26px;
}
.tl-right .tl-year {
  left: 26px;
}



/* 移动端适配 */
@media (max-width: 768px) {
  #timeline::before {
    left: 20px;
  }
  .tl-item.tl-left,
  .tl-item.tl-right {
    justify-content: flex-start;
    padding-left: 56px;
    padding-right: 16px;
  }
  .tl-dot {
    left: 20px;
  }
  .tl-year {
    position: absolute;
    left: 26px !important;
    right: auto !important;
  }
  .tl-card {
    max-width: 100%;
    width: 100%;
  }
}

/* 浅色模式时间线 */
body.light-mode #timeline::before {
  opacity: 0.3;
}
body.light-mode .tl-card:hover {
  box-shadow: 0 8px 28px rgba(0,0,0,0.12);
}
body.light-mode .tl-card-img {
  background: rgba(0,0,0,0.04);
}

/* ===== 导出收藏长图按钮 ===== */
.export-collection-btn {
  backdrop-filter: blur(10px) saturate(180%);
  -webkit-backdrop-filter: blur(10px) saturate(180%);
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  color: var(--text);
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 6px 14px;
  margin-left: 10px;
  letter-spacing: 0.5px;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.export-collection-btn:hover {
  background: var(--card-hover-bg);
  border-color: rgba(255,255,255,0.32);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.export-collection-btn:active {
  transform: scale(0.96);
}
.export-collection-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
}
.export-collection-btn svg {
  width: 14px; height: 14px;
}

</style>
</head>

// ===== SVG 精美占位图生成 =====
function placeholdImage(img, name, code, category) {
  const colors = {
    civil: ['#0d47a1', '#1565c0', '#42a5f5'],
    fighter: ['#1a237e', '#283593', '#5c6bc0'],
    bomber: ['#263238', '#37474f', '#607d8b'],
    transport: ['#1b5e20', '#2e7d32', '#66bb6a'],
    helicopter: ['#4a148c', '#6a1b9a', '#ab47bc']
  };
  const c = colors[category] || colors.civil;
  const w = 800, h = 400;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c[0]}"/>
        <stop offset="100%" stop-color="${c[1]}"/>
      </linearGradient>
      <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
        <stop offset="50%" stop-color="rgba(255,255,255,0.02)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect width="${w}" height="${h}" fill="url(#bg)"/>
    <rect width="${w}" height="${h}" fill="url(#shine)"/>
    <circle cx="${w*0.15}" cy="${h*0.25}" r="${w*0.25}" fill="rgba(255,255,255,0.03)"/>
    <circle cx="${w*0.82}" cy="${h*0.72}" r="${w*0.18}" fill="rgba(255,255,255,0.03)"/>
    <circle cx="${w*0.5}" cy="${h*0.5}" r="${w*0.35}" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <g transform="translate(${w/2},${h*0.42})" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="0" cy="0" rx="140" ry="14" fill="rgba(255,255,255,0.06)"/>
      <line x1="-130" y1="0" x2="130" y2="0"/>
      <line x1="-20" y1="0" x2="-120" y2="-60"/>
      <line x1="-20" y1="0" x2="-120" y2="60"/>
      <line x1="20" y1="0" x2="110" y2="-45"/>
      <line x1="20" y1="0" x2="110" y2="45"/>
      <line x1="100" y1="0" x2="140" y2="-35"/>
      <line x1="100" y1="0" x2="140" y2="35"/>
      <circle cx="-80" cy="-35" r="8" fill="rgba(255,255,255,0.1)"/>
      <circle cx="-80" cy="35" r="8" fill="rgba(255,255,255,0.1)"/>
      <circle cx="70" cy="-25" r="8" fill="rgba(255,255,255,0.1)"/>
      <circle cx="70" cy="25" r="8" fill="rgba(255,255,255,0.1)"/>
    </g>
    <text x="${w/2}" y="${h*0.72}" text-anchor="middle" fill="white" font-family="-apple-system,'PingFang SC',sans-serif" font-size="36" font-weight="700" letter-spacing="3" filter="url(#glow)">${name}</text>
    <text x="${w/2}" y="${h*0.72+42}" text-anchor="middle" fill="${c[2]}" font-family="-apple-system,'PingFang SC',sans-serif" font-size="18" font-weight="600" letter-spacing="5">${code.toUpperCase()}</text>
    <rect x="${w/2-50}" y="${h-48}" width="100" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="${w/2}" y="${h-30}" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" letter-spacing="2">${category==='civil'?t('catCivil'):category==='fighter'?t('catFighter'):category==='bomber'?t('catBomber'):category==='transport'?t('catTransport'):t('catHelicopter')}</text>
  </svg>`;
  img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
}

// ===== 图片代理：解决维基图片国内加载问题 =====
function proxyUrl(url) {
  if (!url || (!url.includes('wikimedia.org') && !url.includes('wikipedia.org') && !url.includes('clearbit.com'))) return url;
  return 'https://wsrv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, '')) + '&w=800&output=webp';
}

function exportAirlineImage() {
  if (!currentAirline) return;
  var al = airlines[currentAirline];
  if (!al) return;

  var filtered = aircrafts.filter(function(a) {
    return (a.airlineIds || []).includes(currentAirline);
  });

  if (filtered.length === 0) { alert('该航司暂无收录机型'); return; }

  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var W = 700;
  var padding = 24;
  var headerH = 64;
  var rowH = 52;
  var footerH = 20;
  var canvasH = headerH + filtered.length * rowH + footerH;

  var canvas = document.createElement('canvas');
  canvas.width = W * dpr;
  canvas.height = canvasH * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // White bg
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, canvasH);

  // Header
  ctx.fillStyle = '#0d2137';
  ctx.fillRect(0, 0, W, headerH);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(al.name + ' · ' + al.code, padding, 28);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(al.country + ' | 收录 ' + filtered.length + ' 款机型', padding, 50);

  // Rows
  var specLabels = { cruise_speed: '巡航速度', max_speed: '最大速度', max_range: '最大航程', range: '航程', combat_radius: '作战半径', capacity: '载客量', load: '载重', wingspan: '翼展', ceiling: '升限', rotor_diameter: '旋翼直径' };

  filtered.forEach(function(a, i) {
    var y = headerH + i * rowH;
    if (i % 2 === 0) {
      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(0, y, W, rowH);
    }

    // Name + code on same line
    ctx.textAlign = 'left';
    ctx.fillStyle = '#1a1a2e';
    ctx.font = 'bold 13px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText(t(a.name) || a.code, padding, y + 18);

    // Specs on the right
    ctx.textAlign = 'right';
    ctx.fillStyle = '#78909c';
    ctx.font = '9px -apple-system, "PingFang SC", sans-serif';
    var specKeys = Object.keys(a.specs || {});
    var specsStr = specKeys.slice(0, 3).map(function(k) { return a.specs[k]; }).join(' · ');
    ctx.fillText(specsStr, W - padding, y + 18);

    // Code + brief desc on second line
    ctx.textAlign = 'left';
    ctx.fillStyle = '#90a4ae';
    ctx.font = '9px -apple-system, "PingFang SC", sans-serif';
    var descText = t(a.desc).replace(/<[^>]+>/g, '').substring(0, 40);
    ctx.fillText(a.code + ' — ' + descText + '…', padding, y + 38);

    // Bottom separator
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(padding, y + rowH - 0.5);
    ctx.lineTo(W - padding, y + rowH - 0.5);
    ctx.stroke();
    ctx.textAlign = 'left';
  });

  // Border
  ctx.strokeStyle = '#0d2137';
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, W, canvasH);

  // Footer
  ctx.fillStyle = '#90a4ae';
  ctx.font = '9px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('Generated: ' + new Date().toISOString().slice(0,10), W - padding, canvasH - 6);
  ctx.textAlign = 'left';

  try {
    canvas.toBlob(function(blob) {
      var url = URL.createObjectURL(blob);
      var el = document.createElement('a');
      el.href = url;
      el.download = (al.name || al.code).replace(/[\/\\:]/g, '-') + '-机型合集.png';
      el.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch(e) {
    alert('导出图片失败');
  }
}

function filterByAirline(aid) {

  document.querySelectorAll('.filter-bar .filter-chip').forEach(function(c) { c.classList.remove('active'); });
  var allChip = document.querySelector('.filter-bar .filter-chip[data-filter="all"]');
  if (allChip) allChip.classList.add('active');
  var al = airlines[aid];
  document.getElementById('airlineFilterName').textContent = al ? al.name : aid;
  document.getElementById('airlineFilterBar').style.display = 'flex';
  updateAirlineLogosBar();
  renderCards();
  if (document.getElementById('timeline').style.display !== 'none') {
    initTimeline();
  } else {
    document.getElementById('grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function extractNumeric(specStr) {
  if (!specStr) return 0;
  // Handle "525–853 人" → 853, "15,200 km" → 15200, "0.85 马赫" → 0.85, "293 km/h" → 293
  const nums = specStr.match(/[\d.]+/g);
  if (!nums || nums.length === 0) return 0;
  const arr = nums.map(n => parseFloat(n.replace(/,/g, '')));
  return Math.max(...arr);
}

function getSortValue(a) {
  if (sortBy === 'speed') {
    const speedKey = a.specs['cruise_speed'] || a.specs['max_speed'] || '0';
    return extractNumeric(speedKey);
  } else if (sortBy === 'range') {
    const rangeKey = a.specs['max_range'] || a.specs['range'] || a.specs['combat_radius'] || '0';
    return extractNumeric(rangeKey);
  } else if (sortBy === 'capacity') {
    const capKey = a.specs['capacity'] || a.specs['payload'] || '0';
    return extractNumeric(capKey);
  }
  return 0;
}

  const grid = document.getElementById('grid');
  const countryBar = document.getElementById('countryBar');
  const searchHint = document.getElementById('searchHint');
  const searchClear = document.getElementById('searchClear');

  if (currentFilter === 'civil') {
    countryBar.classList.add('visible');
  } else {
    countryBar.classList.remove('visible');
  }

  let filtered = aircrafts.filter(a => currentFilter === 'all' ? true : a.category === currentFilter);

  if (currentFilter === 'civil' && currentCountry !== 'all') {
    filtered = filtered.filter(a => matchesCountry(a));
  }

  // Airline filter (clicked from detail modal)
  if (currentAirline) {
    filtered = filtered.filter(a => (a.airlineIds || []).includes(currentAirline));
  }


  // Search filter
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    filtered = filtered.filter(a =>
      t(a.name).toLowerCase().includes(q) ||
      a.code.toLowerCase().includes(q) ||
      t(a.desc).toLowerCase().includes(q)
    );
  }

  // Show/hide search clear button
  if (searchQuery.trim()) {
    searchClear.classList.add('visible');
  } else {
    searchClear.classList.remove('visible');
  }

  // Search results hint
  if (searchQuery.trim() && filtered.length === 0) {
    searchHint.style.display = 'block';
    searchHint.textContent = `未找到匹配"${searchQuery.trim()}"的飞行器`;
  } else if (searchQuery.trim()) {
    searchHint.style.display = 'block';
    searchHint.textContent = `找到 ${filtered.length} 款匹配飞行器`;
  } else {
    searchHint.style.display = 'none';
  }

  // Sort
  if (currentFilter === 'civil' && !searchQuery.trim() && !userSetSort) {
    filtered.sort((a, b) => (b.airlineIds || []).length - (a.airlineIds || []).length);
  } else {
    filtered.sort((a, b) => {
      const va = getSortValue(a);
      const vb = getSortValue(b);
      return sortDir === 'asc' ? vb - va : va - vb;
    });
  }

  // Build card HTML items array (no DOM write yet)
  const items = filtered.map((a, i) => {
    const isCompared = compareSet.has(a.id);
    return `
    <div class="card card-animate tilt-active${a._custom ? ' custom-card' : ''}" data-id="${a.id}" style="--i:${i}" onclick="openDetail(${a.id})" oncontextmenu="if(${!!a._custom}){event.preventDefault();toggleCustomDeleteMode(${a.id});}">
      <div class="card-image-wrap">
        <div class="skeleton-img"></div>
        <img src="${proxyUrl(a.image)}" alt="${t(a.name)}" loading="lazy"
             onload="this.classList.add('loaded'); this.previousElementSibling.classList.add('hidden')"
             onerror="placeholdImage(this,'${t(a.name)}','${a.code}','${a.category}'); this.previousElementSibling.classList.add('hidden')">
        <div class="card-badge">${a.country}</div>
        <div class="card-compare-check ${isCompared ? 'checked' : ''}"
             onclick="event.stopPropagation(); toggleCompare(${a.id})"
             title="${isCompared ? t('cancelCompare') : t('addCompare')}">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="card-bookmark ${collection.has(a.id) ? 'collected' : ''}"
             onclick="event.stopPropagation(); toggleCollect(${a.id})">
          <svg viewBox="0 0 24 24"><path d="M5 21V5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21z"/></svg>
        </div>
        ${a._custom ? '<div class="custom-delete-btn" onclick="event.stopPropagation();deleteCustomAircraft('+a.id+')">'+t('deleteCustom')+'</div>' : ''}
      </div>
      <div class="card-body">
        <h3>${t(a.name)}</h3>
        <div class="model-code">${a.code}</div>
        <div class="desc">${t(a.desc)}</div>
        <div class="card-stats">
          <div class="stat"><div class="stat-value">${a.specs['cruise_speed'] || a.specs['max_speed'] || '--'}</div><div class="stat-label">${t('sortSpeed')}</div></div>
          <div class="stat"><div class="stat-value">${a.specs['wingspan'] || a.specs['rotor_diameter'] || '--'}</div><div class="stat-label">${t('specWingspan')}</div></div>
        </div>
      </div>
    </div>`;
  });

  // P3: Show skeleton cards before rendering real content
  const SKELETON_COUNT = 6;
  const skeletonHTML = Array.from({ length: SKELETON_COUNT }, function(_, i) {
    return '<div class="skeleton-card" style="--i:' + i + '">' +
      '<div class="skel-img"></div>' +
      '<div class="skel-body">' +
        '<div class="skel-line medium"></div>' +
        '<div class="skel-line short"></div>' +
        '<div class="skel-line" style="width:90%"></div>' +
        '<div class="skel-stats">' +
          '<div class="skel-stat"><div class="skel-line short" style="margin-bottom:0;height:12px"></div></div>' +
          '<div class="skel-stat"><div class="skel-line short" style="margin-bottom:0;height:12px"></div></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  // Batch progressive rendering: 6 cards per frame to avoid main-thread jank
  const BATCH_SIZE = 6;
  grid.innerHTML = skeletonHTML;
  updateCollectionCount();
  updateCompareBar();

  if (items.length === 0) {
    // Clear skeletons after a brief delay when no results
    setTimeout(function() { if (grid.querySelector('.skeleton-card')) grid.innerHTML = ''; }, 350);
    return;
  }

  let batchIndex = 0;
  function renderBatch() {
    try {
      if (batchIndex === 0) {
        // Replace skeletons with first batch of real cards
        grid.innerHTML = items.slice(0, BATCH_SIZE).join('');
      } else {
        const start = batchIndex * BATCH_SIZE;
        const end = Math.min(start + BATCH_SIZE, items.length);
        if (start >= items.length) return;
        grid.insertAdjacentHTML('beforeend', items.slice(start, end).join(''));
      }
      batchIndex++;
      if (batchIndex * BATCH_SIZE < items.length) {
        requestAnimationFrame(renderBatch);
      } else {
        requestAnimationFrame(function() { initCardAnimation(); });
      }
    } catch (e) {
      console.error('renderBatch error:', e);
      // Fallback: render all cards at once
      grid.innerHTML = items.join('');
      requestAnimationFrame(function() { initCardAnimation(); });
    }
  }
  requestAnimationFrame(renderBatch);
}

function toggleCompare(id) {
  if (compareSet.has(id)) {
    compareSet.delete(id);

    if (compareSet.size >= 2) {
      // Remove the first one
      const first = compareSet.values().next().value;
      compareSet.delete(first);
    }
    compareSet.add(id);

  updateCompareBar();

function updateCompareBar() {
  const bar = document.getElementById('compareBar');
  const slot1 = document.getElementById('compareSlot1');
  const slot2 = document.getElementById('compareSlot2');
  const btn = document.getElementById('compareBtn');

  const ids = [...compareSet];
  if (ids.length >= 1) {
    const a1 = aircrafts.find(x => x.id === ids[0]);
    slot1.textContent = a1 ? t(a1.name) : t('selectSlot1');
    slot1.classList.add('filled');
  } else {
    slot1.textContent = t('selectSlot1');
    slot1.classList.remove('filled');

    slot2.classList.add('filled');

    slot2.classList.remove('filled');

}

function clearCompare() {

  updateCompareBar();

function showCompare() {
  const ids = [...compareSet];
  if (ids.length < 2) return;
  const a1 = aircrafts.find(x => x.id === ids[0]);
  const a2 = aircrafts.find(x => x.id === ids[1]);
  if (!a1 || !a2) return;
  window._track('compare', { id1: a1.id, id2: a2.id, name1: t(a1.name), name2: t(a2.name) });

  // Determine which specs to compare (find common keys)
  const specKeys1 = Object.keys(a1.specs);
  const specKeys2 = Object.keys(a2.specs);
  // Use keys from a1 as primary
  const specRows = specKeys1.map((key, idx) => {
    const v1 = a1.specs[key];
    const v2_key = specKeys2[idx] || specKeys2.find(k => k.includes(key.slice(0,2))) || '';
    const v2 = v2_key ? a2.specs[v2_key] : '--';
    const n1 = extractNumeric(v1);
    const n2 = extractNumeric(v2);
    const better1 = n1 > n2 ? 'better' : '';
    const better2 = n2 > n1 ? 'better' : '';
    return { key, v1, v2, better1, better2 };
  });

  const specRowsHTML = specRows.map(r => `
    <div class="compare-spec-row">
      <span class="spec-value ${r.better1}">${r.v1}</span>
      <span class="spec-label">${specLabel(r.key)}</span>
      <span class="spec-value ${r.better2}">${r.v2}</span>
    </div>
  `).join('');

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="compare-modal">
      <div class="compare-header">
        <h2>${t('compareTitle')}</h2>
        <div class="modal-close" onclick="closeDetail()" style="position:static">&times;</div>
      </div>
      <div class="compare-grid">
        <div class="compare-col">
          <img class="compare-img" src="${proxyUrl(a1.image)}" alt="${t(a1.name)}"
               onerror="placeholdImage(this,'${t(a1.name)}','${a1.code}','${a1.category}')">
          <h3>${t(a1.name)}</h3>
          <div class="compare-code">${a1.code} · ${a1.country}</div>
          <div class="compare-desc">${t(a1.desc)}</div>
        </div>
        <div class="compare-col">
          <img class="compare-img" src="${proxyUrl(a2.image)}" alt="${t(a2.name)}"
               onerror="placeholdImage(this,'${t(a2.name)}','${a2.code}','${a2.category}')">
          <h3>${t(a2.name)}</h3>
          <div class="compare-code">${a2.code} · ${a2.country}</div>
          <div class="compare-desc">${t(a2.desc)}</div>
        </div>
      </div>
      <div style="padding:0 28px 28px">
        ${specRowsHTML}
      </div>
    </div>
  `;

  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDetail(); });
  document.getElementById('overlayContainer').appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

// ===== 3D 倾斜效果 =====
function initTiltEffect() {
  document.addEventListener('mousemove', (e) => {
    const cards = document.querySelectorAll('.card.tilt-active:hover');
    cards.forEach(card => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -8;
      const rotateY = ((x - centerX) / centerX) * 8;
      card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-7px) scale(1.015)`;
    });
  });

  document.addEventListener('mouseleave', (e) => {
    // Reset cards when mouse leaves document (optional, card mouseleave handles most)
  }, true);
}

// Reset individual card on mouseleave via event delegation
document.getElementById('grid').addEventListener('mouseleave', (e) => {
  const card = e.target.closest('.card.tilt-active');
  if (card) {
    card.style.transform = '';
  }
}, true);

// ===== 卡片入场动画 (IntersectionObserver + CSS transition) =====
var _cardObserver = null;
function initCardAnimation() {
  if (_cardObserver) _cardObserver.disconnect();
  var cards = document.querySelectorAll('.card.card-animate:not(.skeleton-card)');
  if (!cards.length) return;

  _cardObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('card-visible');
        _cardObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });

  cards.forEach(function(card, index) {
    card.style.transitionDelay = (index % 12) * 45 + 'ms';
    _cardObserver.observe(card);
  });

  // Safety fallback: ensure cards become visible within 800ms
  setTimeout(function() {
    cards.forEach(function(card) {
      if (!card.classList.contains('card-visible')) {
        card.classList.add('card-visible');
      }
    });
  }, 800);
}

var suggestionsDropdown = document.getElementById('suggestionsDropdown');

function showSuggestions(query) {
  if (!query) { suggestionsDropdown.classList.remove('visible'); return; }
  var q = query.toLowerCase();
  var matches = [];
  for (var i = 0; i < aircrafts.length; i++) {
    var a = aircrafts[i];
    var nameText = t(a.name).toLowerCase();
    var codeText = a.code.toLowerCase();
    if (nameText.includes(q) || codeText.includes(q)) {
      matches.push(a);
      if (matches.length >= 5) break;
    }
  }
  if (matches.length === 0) { suggestionsDropdown.classList.remove('visible'); return; }
  var html = '';
  for (var j = 0; j < matches.length; j++) {
    var a = matches[j];
    html += '<div class="suggestion-item" data-id="' + a.id + '">' +
      '<img class="suggestion-thumb" src="' + a.image + '" alt="">' +
      '<div class="suggestion-info">' +
      '<span class="suggestion-name">' + t(a.name) + '</span>' +
      '<span class="suggestion-code">' + a.code + '</span>' +
      '</div></div>';
  }
  suggestionsDropdown.innerHTML = html;
  suggestionsDropdown.classList.add('visible');
}

suggestionsDropdown.addEventListener('click', function(e) {
  var item = e.target.closest('.suggestion-item');
  if (!item) return;
  var id = parseInt(item.dataset.id);
  suggestionsDropdown.classList.remove('visible');
  openDetail(id);
});

// Close suggestions on Escape or click outside
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') suggestionsDropdown.classList.remove('visible');
});
document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-wrap')) suggestionsDropdown.classList.remove('visible');
});

var _suggestTimer = null;
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  clearTimeout(window._searchDebounce);
  window._searchDebounce = setTimeout(function() {
    if (searchQuery.trim()) window._track('search', { query: searchQuery.trim() });
  }, 800);
  clearTimeout(_suggestTimer);
  var q = searchQuery.trim();
  if (q) {
    _suggestTimer = setTimeout(function() { showSuggestions(q); }, 200);
  } else {
    suggestionsDropdown.classList.remove('visible');
  }
  renderCards();
  if (document.getElementById('timeline').style.display !== 'none') initTimeline();
});

document.getElementById('sortGroup').addEventListener('click', (e) => {
  const chip = e.target.closest('.sort-chip');
  if (!chip) return;
  const newSort = chip.dataset.sort;
  if (sortBy === newSort) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortBy = newSort;
    sortDir = 'asc';
  }
  window._track('sort', { by: sortBy, dir: sortDir });
  userSetSort = true;
  updateSortUI();
  renderCards();
  if (document.getElementById('timeline').style.display !== 'none') initTimeline();
});

var _customDeleteModeId = null;

function initCustomCardContextMenu() {
  // Close delete mode on clicking anywhere else
  document.addEventListener('click', function(e) {
    if (_customDeleteModeId !== null && !e.target.closest('.custom-card')) {
      exitCustomDeleteMode();
    }
  });
  // Long-press detection on touch devices
  var longPressTimer = null;
  document.addEventListener('touchstart', function(e) {
    var card = e.target.closest('.custom-card');
    if (!card) return;
    longPressTimer = setTimeout(function() {
      var id = parseInt(card.getAttribute('data-id'));
      if (!isNaN(id)) toggleCustomDeleteMode(id);
    }, 600);
  }, { passive: true });
  document.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
  document.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
}

function toggleCustomDeleteMode(id) {
  if (_customDeleteModeId === id) { exitCustomDeleteMode(); return; }
  exitCustomDeleteMode();
  var card = document.querySelector('.card[data-id="' + id + '"]');
  if (card) { card.classList.add('custom-mode'); _customDeleteModeId = id; }
}

function exitCustomDeleteMode() {
  if (_customDeleteModeId !== null) {
    var prev = document.querySelector('.card[data-id="' + _customDeleteModeId + '"]');
    if (prev) prev.classList.remove('custom-mode');
    _customDeleteModeId = null;
  }
}

// ===== 自定义机型: 删除 =====
function deleteCustomAircraft(id) {
  if (!confirm(t('deleteConfirm'))) return;
  exitCustomDeleteMode();
  // 记录 name/desc keys 以备清理
  var removed = null;
  for (var i = aircrafts.length - 1; i >= 0; i--) {
    if (aircrafts[i].id === id) { removed = aircrafts.splice(i, 1)[0]; break; }
  }
  if (!removed) return;
  // 更新 localStorage
  try {
    var custom = JSON.parse(localStorage.getItem('custom_aircrafts') || '[]');
    custom = custom.filter(function(a) { return a.id !== id; });
    localStorage.setItem('custom_aircrafts', JSON.stringify(custom));
    // 清理 i18n
    var savedI18n = JSON.parse(localStorage.getItem('custom_i18n') || '{}');
    delete savedI18n[removed.name];
    delete savedI18n[removed.desc];
    delete i18n.zh[removed.name];
    delete i18n.zh[removed.desc];
    localStorage.setItem('custom_i18n', JSON.stringify(savedI18n));
  } catch(e) {}
  renderCards();
  if (document.getElementById('timeline').style.display !== 'none') initTimeline();
}

  var country = document.getElementById('af_country').value.trim();

  var range = document.getElementById('af_range').value.trim();

  var wingspan = document.getElementById('af_wingspan').value.trim();
  var prodDate = document.getElementById('af_prodDate').value.trim();
  var descZh = document.getElementById('af_descZh').value.trim();

  if (!zh || !code) { alert('中文名称和型号为必填项'); return; }

  var nameKey = 'name_custom_' + _customIdCounter;
  var descKey = 'desc_custom_' + _customIdCounter;

  // 收集选中航司
  var selectedAirlines = [];
  var chips = document.querySelectorAll('#af_airlineChips .airline-chip.selected');
  chips.forEach(function(c) { selectedAirlines.push(c.getAttribute('data-id')); });

  // 构建新机型
  var newAircraft = {
    id: _customIdCounter,
    name: nameKey,
    code: code,
    category: category,
    country: country || '--',
    image: image || '',
    desc: descKey,
    airlineIds: selectedAirlines.length ? selectedAirlines : undefined,
    specs: {
      'cruise_speed': speed || '--',
      'range': range || '--',
      'capacity': capacity || '--',
      'wingspan': wingspan || '--'
    },
    slug: '',
    _custom: true,
    prodDate: prodDate || ''
  };

  // 写入 i18n
  i18n.zh[nameKey] = zh;
  if (descZh) i18n.zh[descKey] = descZh;
  else i18n.zh[descKey] = '';

  // 保存到 localStorage
  try {
    var custom = JSON.parse(localStorage.getItem('custom_aircrafts') || '[]');
    custom.push({
      id: _customIdCounter, name: nameKey, code: code, category: category,
      country: country || '--', image: image || '', desc: descKey,
      specs: newAircraft.specs, airlineIds: newAircraft.airlineIds,
      prodDate: prodDate || ''
    });
    localStorage.setItem('custom_aircrafts', JSON.stringify(custom));
    // 持久化 i18n
    var savedI18n = JSON.parse(localStorage.getItem('custom_i18n') || '{}');
    savedI18n[nameKey] = { zh: zh };
    savedI18n[descKey] = { zh: descZh || '' };
    localStorage.setItem('custom_i18n', JSON.stringify(savedI18n));
  } catch(e) {}

  // 加入当前 aircrafts
  aircrafts.push(newAircraft);
  if (prodDate) prodYearLookup['' + _customIdCounter] = prodDate;
  _customIdCounter++;
  closeAddForm();
  renderCards();
  if (document.getElementById('timeline').style.display !== 'none') initTimeline();

function openImageLightbox(imageSrc) {
  // Remove existing lightbox
  var existing = document.querySelector('.image-lightbox');
  if (existing) existing.remove();

  var lb = document.createElement('div');
  lb.className = 'image-lightbox';

  // Spinner
  var spinner = document.createElement('div');
  spinner.className = 'lightbox-spinner';
  lb.appendChild(spinner);

  // Close button
  var closeBtn = document.createElement('div');
  closeBtn.className = 'lightbox-close';
  closeBtn.textContent = '\u00d7';
  closeBtn.addEventListener('click', function(e) { e.stopPropagation(); closeImageLightbox(); });
  lb.appendChild(closeBtn);

  // Zoom hint
  var hint = document.createElement('div');
  hint.className = 'lightbox-zoom-hint';
  hint.textContent = '\u{1F50D} \u6EDA\u8F6E\u7F29\u653E';
  lb.appendChild(hint);

  // Image
  var img = document.createElement('img');
  img.alt = 'preview';
  img.style.display = 'none';
  img.onload = function() {
    spinner.remove();
    img.style.display = '';
    // Fade hint after 3s
    setTimeout(function() { hint.style.opacity = '0'; }, 3000);
  };
  img.onerror = function() {
    spinner.remove();
    closeImageLightbox();
  };
  lb.appendChild(img);

  // Click background to close
  lb.addEventListener('click', function(e) {
    if (e.target === lb) closeImageLightbox();
  });

  // Mouse wheel zoom
  var scale = 1;
  img.addEventListener('wheel', function(e) {
    e.preventDefault();
    e.stopPropagation();
    var delta = e.deltaY > 0 ? -0.08 : 0.08;
    scale = Math.min(4, Math.max(0.5, scale + delta));
    img.style.transform = 'scale(' + scale + ')';
  }, { passive: false });

  document.body.appendChild(lb);
  document.body.style.overflow = 'hidden';

  // Load image after DOM insertion
  img.src = imageSrc;
}

function closeImageLightbox() {
  var lb = document.querySelector('.image-lightbox');
  if (lb) lb.remove();
  // Only restore scrolling if detail overlay is also closed
  if (!document.getElementById('overlayContainer').children.length) {
    document.body.style.overflow = '';

}

// ===== P4: 相关推荐逻辑 =====
function getRelatedAircraft(currentId, limit) {
  limit = limit || 4;
  var current = aircrafts.find(function(x) { return x.id === currentId; });
  if (!current) return [];

  var isCivil = current.category === 'civil';

  // Phase 1: same category
  var sameCat = aircrafts.filter(function(a) {
    return a.id !== currentId && a.category === current.category;
  });

  // Phase 2: same manufacturer (as fallback, if phase 1 < limit)
  // For civil aircraft, use country as manufacturer proxy; for military, category is the binding factor
  var manufacturer = current.code.split(' ')[0]; // e.g. "Airbus", "Boeing", "COMAC"
  if (isCivil && sameCat.length < limit) {
    // Add same-manufacturer civil aircraft from different sub-types but still civil
    var sameMfr = aircrafts.filter(function(a) {
      return a.id !== currentId && a.category === 'civil' && a.code.split(' ')[0] === manufacturer && !sameCat.some(function(s) { return s.id === a.id; });
    });
    sameCat = sameCat.concat(sameMfr);
  }

  // Deduplicate and limit
  var seen = {};
  var result = [];
  for (var i = 0; i < sameCat.length; i++) {
    if (seen[sameCat[i].id]) continue;
    seen[sameCat[i].id] = true;
    result.push(sameCat[i]);
    if (result.length >= limit) break;
  }

  return result;
}

function renderRelatedSection(currentId) {
  var related = getRelatedAircraft(currentId, 4);
  if (!related.length) return '';

  var cards = related.map(function(r) {
    return '<div class="related-card" onclick="event.stopPropagation();switchToAircraft(' + r.id + ')" title="' + t(r.name) + '">' +
      '<img class="related-card-img" src="' + proxyUrl(r.image) + '" alt="' + t(r.name) + '" loading="lazy"' +
      ' onerror="placeholdImage(this,\'' + t(r.name) + '\',\'' + r.code + '\',\'' + r.category + '\')">' +
      '<div class="related-card-name">' + t(r.name) + '</div>' +
    '</div>';
  }).join('');

  return '<div class="related-section"><h3>' + t('relatedTitle') + '</h3>' +
    '<div class="related-grid">' + cards + '</div></div>';
}
