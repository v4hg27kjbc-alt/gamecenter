// ===== Hero Banner 轮播 =====
function initHeroBanner() {
  const heroIds = [26, 2, 3, 8]; // 747-8, 787-9, A350-900, A330-300
  const heroAircraft = heroIds.map(function(id) {
    return aircrafts.find(function(a) { return a.id === id; });
  }).filter(Boolean);

  if (heroAircraft.length === 0) return;

  const banner = document.getElementById('heroBanner');
  const dotsContainer = document.getElementById('heroDots');
  let currentIndex = 0;
  let autoTimer = null;
  const INTERVAL = 4000;

  // Build slides
  heroAircraft.forEach(function(a, i) {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
    slide.innerHTML =
      '<div class="hero-bg" style="background-image:url(' + proxyUrl(a.image) + ')"></div>' +
      '<div class="hero-content">' +
        '<div class="hero-text">' +
          '<h2>' + t(a.name) + '</h2>' +
          '<div class="hero-manufacturer">' + (a.code.split(' ')[0] || '') + ' · ' + a.country + '</div>' +
          '<div class="hero-desc">' + t(a.desc) + '</div>' +
        '</div>' +
        '<div class="hero-image">' +
          '<img src="' + proxyUrl(a.image) + '" alt="' + t(a.name) + '" onerror="this.style.display=\'none\'">' +
        '</div>' +
      '</div>';
    slide.addEventListener('click', function() { openDetail(a.id); });
    banner.insertBefore(slide, dotsContainer);

    // Dot
    const dot = document.createElement('button');
    dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', t(a.name));
    dot.addEventListener('click', function(e) {
      e.stopPropagation();
      goToSlide(i);
    });
    dotsContainer.appendChild(dot);
  });

  const slides = banner.querySelectorAll('.hero-slide');
  const dots = dotsContainer.querySelectorAll('.hero-dot');

  function goToSlide(index) {
    slides.forEach(function(s) { s.classList.remove('active'); });
    dots.forEach(function(d) { d.classList.remove('active'); });
    currentIndex = index;
    slides[currentIndex].classList.add('active');
    dots[currentIndex].classList.add('active');
    resetTimer();
  }

  function nextSlide() {
    goToSlide((currentIndex + 1) % slides.length);
  }

  function prevSlide() {
    goToSlide((currentIndex - 1 + slides.length) % slides.length);
  }

  function startTimer() {
    stopTimer();
    autoTimer = setInterval(nextSlide, INTERVAL);
  }

  function stopTimer() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }

  function resetTimer() {
    stopTimer();
    startTimer();
  }

  document.getElementById('heroPrev').addEventListener('click', prevSlide);
  document.getElementById('heroNext').addEventListener('click', nextSlide);

  // Pause on hover
  banner.addEventListener('mouseenter', stopTimer);
  banner.addEventListener('mouseleave', startTimer);

  // Touch swipe support
  let touchStartX = 0;
  banner.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; });
  banner.addEventListener('touchend', function(e) {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) nextSlide();
      else prevSlide();
    }
  });

  startTimer();
}

// ===== 统计面板动画与更新 =====
var _statsAnimated = false;
function animateStats() {
  if (_statsAnimated) { updateStatsNumbers(); return; }
  _statsAnimated = true;
  var cards = [
    { el: document.getElementById('statTotalAircraft'), target: aircrafts.length },
    { el: document.getElementById('statAirlines'), target: Object.keys(airlines).length },
    { el: document.getElementById('statCollection'), target: collection.size },
    { el: document.getElementById('statCountries'), target: getUniqueCountryCount() }
  ];
  // Types stat is text, handle separately
  updateTypesStat();

  var duration = 600;
  cards.forEach(function(card) {
    card.el.setAttribute('data-target', card.target);
    animateNumber(card.el, card.target, duration);
  });
}

function updateStatsNumbers() {
  document.getElementById('statTotalAircraft').textContent = aircrafts.length;
  document.getElementById('statTotalAircraft').setAttribute('data-target', aircrafts.length);
  document.getElementById('statAirlines').textContent = Object.keys(airlines).length;
  document.getElementById('statAirlines').setAttribute('data-target', Object.keys(airlines).length);
  document.getElementById('statCollection').textContent = collection.size;
  document.getElementById('statCollection').setAttribute('data-target', collection.size);
  document.getElementById('statCountries').textContent = getUniqueCountryCount();
  document.getElementById('statCountries').setAttribute('data-target', getUniqueCountryCount());
  updateTypesStat();
  var btn = document.getElementById('exportCollectionBtn');
  if (btn) btn.disabled = collection.size === 0;
}

function getUniqueCountryCount() {
  var countries = new Set();
  aircrafts.forEach(function(a) { if (a.country) countries.add(a.country); });
  return countries.size;
}

function updateTypesStat() {
  var types = { civil: 0, fighter: 0, bomber: 0, transport: 0, helicopter: 0 };
  aircrafts.forEach(function(a) { if (types[a.category] !== undefined) types[a.category]++; });
  document.getElementById('statTypes').textContent =
    '民航 ' + types.civil + ' / 战斗 ' + types.fighter;
}

function animateNumber(el, target, duration) {
  var start = 0;
  var startTime = null;
  function step(timestamp) {
    if (!startTime) startTime = timestamp;
    var progress = Math.min((timestamp - startTime) / duration, 1);
    // easeOutCubic
    var eased = 1 - Math.pow(1 - progress, 3);
    var current = Math.round(eased * target);
    el.textContent = current;
    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      el.textContent = target;
    }
  }
  requestAnimationFrame(step);
}

// Use IntersectionObserver to trigger stats animation when visible
(function initStatsObserver() {
  var panel = document.getElementById('statsPanel');
  if (!panel) return;
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        animateStats();
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });
  observer.observe(panel);
  // Also trigger immediately if already visible
  setTimeout(function() {
    var rect = panel.getBoundingClientRect();
    if (rect.top < window.innerHeight && rect.bottom > 0) {
      animateStats();
    }
  }, 300);
})();

var prodYearLookup = {
  '1':'2007','2':'2013','3':'2015','4':'2004','5':'2023',

  '20':'2005','21':'2017','22':'1997','23':'1995','24':'2016','25':'1986','26':'2012'

// ===== 时间线视图 =====
function initTimeline() {
  var tl = document.getElementById('timeline');
  if (!tl) return;
  var entriesEl = tl.querySelector('.tl-entries');
  if (!entriesEl) return;

  // 按 productionDate 升序排列，无日期的排最后
  var sorted = aircrafts.slice().sort(function(a, b) {
    var ya = prodYearLookup[a.id] || '9999';
    var yb = prodYearLookup[b.id] || '9999';
    return parseInt(ya) - parseInt(yb);
  });

  // 按当前全部筛选条件过滤（与 renderCards 对齐）
  if (typeof currentFilter !== 'undefined' && currentFilter !== 'all') {
    sorted = sorted.filter(function(a) { return a.category === currentFilter; });
  }
  if (currentFilter === 'civil' && currentCountry !== 'all') {
    sorted = sorted.filter(function(a) { return matchesCountry(a); });
  }
  if (currentAirline) {
    sorted = sorted.filter(function(a) { return (a.airlineIds || []).includes(currentAirline); });
  }
  if (searchQuery.trim()) {
    var q = searchQuery.trim().toLowerCase();
    sorted = sorted.filter(function(a) {
      return t(a.name).toLowerCase().includes(q) ||
        a.code.toLowerCase().includes(q) ||
        t(a.desc).toLowerCase().includes(q);
    });
  }
  var html = '';
  var idx = 0;
  sorted.forEach(function(a) {
    var year = prodYearLookup[a.id] || '--';

        '<div class="tl-card-info">' +

// ===== 深色/浅色模式切换 =====
(function initTheme() {
  var toggleBtn = document.getElementById('themeToggle');
  var sunIcon = document.getElementById('themeIconSun');
  var moonIcon = document.getElementById('themeIconMoon');
  var STORAGE_KEY = 'aviation-theme';

  // --- 图标动画辅助 ---
  function triggerIconAnim(svgEl) {
    toggleBtn.classList.add('anim-icon');
    svgEl.addEventListener('animationend', function handler() {
      svgEl.removeEventListener('animationend', handler);
      toggleBtn.classList.remove('anim-icon');
    }, { once: true });
  }

  function setTheme(mode) {
    var wasDifferent = (mode === 'light') !== document.body.classList.contains('light-mode');
    if (mode === 'light') {
      document.body.classList.add('light-mode');
      if (wasDifferent) {
        sunIcon.style.display = 'none';
        moonIcon.style.display = '';
        triggerIconAnim(moonIcon);
      } else {
        sunIcon.style.display = 'none';
        moonIcon.style.display = '';
      }
    } else {
      document.body.classList.remove('light-mode');
      if (wasDifferent) {
        sunIcon.style.display = '';
        moonIcon.style.display = 'none';
        triggerIconAnim(sunIcon);
      } else {
        sunIcon.style.display = '';
        moonIcon.style.display = 'none';
      }
    }
  }

  // --- 弹窗 ---
  function openThemeModal(context) {
    var modalOverlay = document.getElementById('themeModalOverlay');
    var modalTitle = document.getElementById('themeModalTitle');
    var modalSub = document.getElementById('themeModalSub');
    if (!modalOverlay || !modalTitle || !modalSub) return;
    modalOverlay.setAttribute('data-context', context);
    if (context === 'first-visit') {
      modalTitle.textContent = '选择主题 / Choose Theme';
      modalSub.textContent = '深色还是浅色模式？你随时可以长按右上角按钮更改';
    } else {
      modalTitle.textContent = '主题设置 / Theme Settings';
      modalSub.textContent = '随时切换深浅模式 / Switch anytime';
    }
    modalOverlay.style.display = '';
    modalOverlay.classList.remove('fade-out');
    // 强制回流以重启动画
    void modalOverlay.offsetWidth;
    modalOverlay.style.animation = 'none';
    void modalOverlay.offsetWidth;
    modalOverlay.style.animation = 'themeModalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';
  }

  function closeThemeModal() {
    var modalOverlay = document.getElementById('themeModalOverlay');
    modalOverlay.style.animation = '';
    modalOverlay.classList.add('fade-out');
    modalOverlay.addEventListener('animationend', function handler() {
      modalOverlay.removeEventListener('animationend', handler);
      modalOverlay.style.display = 'none';
      modalOverlay.classList.remove('fade-out');
    }, { once: true });
  }

  // 弹窗内按钮点击 + overlay 关闭（延迟到 DOM 解析完成）
  window.addEventListener('DOMContentLoaded', function() {
    var modalOverlay = document.getElementById('themeModalOverlay');
    if (!modalOverlay) return;
    modalOverlay.querySelectorAll('.theme-modal-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var mode = this.getAttribute('data-theme');
        setTheme(mode);
        try { localStorage.setItem(STORAGE_KEY, mode); } catch(e) {}
        closeThemeModal();
      });
    });
    var closeBtn = document.getElementById('themeModalClose');
    if (closeBtn) {
      closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        closeThemeModal();
      });
    }
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay && modalOverlay.getAttribute('data-context') !== 'first-visit') {
        closeThemeModal();
      }
    });
  });

  // --- 普通点击切换 ---
  function toggleTheme() {
    toggleBtn.classList.add('no-animate');
    var isLight = document.body.classList.contains('light-mode');
    var newMode = isLight ? 'dark' : 'light';
    setTheme(newMode);
    try { localStorage.setItem(STORAGE_KEY, newMode); } catch(e) {}
    // 动画结束后移除 no-animate
    setTimeout(function() { toggleBtn.classList.remove('no-animate'); }, 450);
  }

  // --- 长按检测 ---
  var longPressTimer = null;
  var longPressTriggered = false;
  var pressStartX = 0, pressStartY = 0;

  function onPressStart(e) {
    longPressTriggered = false;
    var pt = e.touches ? e.touches[0] : e;
    pressStartX = pt.clientX;
    pressStartY = pt.clientY;
    toggleBtn.classList.add('long-pressing');
    longPressTimer = setTimeout(function() {
      longPressTriggered = true;
      toggleBtn.classList.remove('long-pressing');
      openThemeModal('settings');
    }, 600);
  }

  function onPressMove(e) {
    if (!longPressTimer) return;
    var pt = e.touches ? e.touches[0] : e;
    var dx = pt.clientX - pressStartX;
    var dy = pt.clientY - pressStartY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
      toggleBtn.classList.remove('long-pressing');
    }
  }

  function onPressEnd(e) {
    toggleBtn.classList.remove('long-pressing');
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
    if (!longPressTriggered) {
      // 普通 click
      toggleTheme();
    }
  }

  // 桌面端
  toggleBtn.addEventListener('mousedown', onPressStart);
  toggleBtn.addEventListener('mousemove', onPressMove);
  toggleBtn.addEventListener('mouseup', onPressEnd);
  toggleBtn.addEventListener('mouseleave', function() {
    toggleBtn.classList.remove('long-pressing');
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  });

  // 移动端
  toggleBtn.addEventListener('touchstart', onPressStart, { passive: false });
  toggleBtn.addEventListener('touchmove', onPressMove, { passive: false });
  toggleBtn.addEventListener('touchend', onPressEnd);

  // 移除旧的 click 监听（用 mousedown+mouseup 已覆盖）
  // toggleBtn 不再挂 click，由 pressEnd 处理短按

  // --- 初始化 ---
  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch(e) {}
  if (saved === 'light') {
    setTheme('light');
  } else if (saved === 'dark') {
    setTheme('dark');
  } else {
    // 无记录：首次访问，不应用任何主题，显示弹窗
    openThemeModal('first-visit');
  }
  // 确保初始图标状态：深色模式下默认显示太阳，浅色模式默认显示月亮
  // setTheme 已处理 display，此处仅兜底无记录场景
  if (saved === null) {
    sunIcon.style.display = '';
    moonIcon.style.display = 'none';
  }
})();

// ===== 埋点系统 =====
(function() {
  const STORAGE_KEY = 'aviation_analytics';
  const VISITOR_KEY = 'aviation_visitor_id';

  function getVisitorId() {
    let vid = localStorage.getItem(VISITOR_KEY);
    if (!vid) {
      vid = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem(VISITOR_KEY, vid);
    }
    return vid;
  }
  const visitorId = getVisitorId();

  function getData() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"events":[]}');
    } catch (e) {
      return { events: [] };
    }
  }

  function saveData(data) {
    try {
      if (data.events.length > 5000) {
        data.events = data.events.slice(-4000);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  window._track = function(eventType, payload) {
    var data = getData();
    var ua = navigator.userAgent;
    var isMobile = /Mobile|Android|iPhone|iPad/i.test(ua);
    var browser = 'Other';
    if (ua.indexOf('Chrome') > -1 && ua.indexOf('Edg') === -1) browser = 'Chrome';
    else if (ua.indexOf('Safari') > -1 && ua.indexOf('Chrome') === -1) browser = 'Safari';
    else if (ua.indexOf('Firefox') > -1) browser = 'Firefox';
    else if (ua.indexOf('Edg') > -1) browser = 'Edge';

    var event = {
      type: eventType,
      timestamp: Date.now(),
      visitorId: visitorId,
      screen: screen.width + 'x' + screen.height,
      browser: browser,
      isMobile: isMobile
    };
    for (var k in payload) { event[k] = payload[k]; }
    data.events.push(event);
    saveData(data);
  };

  // PV
  window._track('pv', { page: 'aviation-collection', title: document.title });
})();


// ===== P2: Hash-based URL routing =====
function handleHashOpen() {
  if (_skipHashHandler) return;
  var hash = window.location.hash.slice(1);
  if (!hash) {
    // Hash cleared (back button from hash to root) — close detail if open
    if (document.getElementById('overlayContainer').children.length > 0) {
      closeDetail();
    }
    return;
  }
  var a = aircrafts.find(function(x) { return x.slug === hash; });
  if (a) {
    _skipHashHandler = true;
    openDetail(a.id);
    setTimeout(function() { _skipHashHandler = false; }, 50);
  }
}

// ===== P4: PWA Service Worker (inline) =====
if ('serviceWorker' in navigator) {
  (function() {
    var swCode = 'const CACHE_NAME="aviation-collection-v1";' +
      'const ASSETS=["/","/manifest.json"];' +
      'self.addEventListener("install",function(e){' +
        'e.waitUntil(caches.open(CACHE_NAME).then(function(c){return c.addAll(ASSETS)}))' +
      '});' +
      'self.addEventListener("activate",function(e){' +
        'e.waitUntil(caches.keys().then(function(keys){' +
          'return Promise.all(keys.filter(function(k){return k!==CACHE_NAME}).map(function(k){return caches.delete(k)}))' +
        '}))' +
      '});' +
      'self.addEventListener("fetch",function(e){' +
        'e.respondWith(' +
          'caches.match(e.request).then(function(r){' +
            'return r||fetch(e.request).then(function(resp){' +
              'if(resp&&resp.status===200&&resp.type==="basic"){' +
                'var clone=resp.clone();' +
                'caches.open(CACHE_NAME).then(function(c){c.put(e.request,clone)})' +
              '}' +
              'return resp' +
            '})' +
          '})' +
        ')' +
      '});';
    try {
      var blob = new Blob([swCode], { type: 'application/javascript' });
      var swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(function() {});
    } catch(e) {}
  })();
}

<script>
// ===== 滚动进度条 =====
(function() {
  var bar = document.getElementById('scrollProgress');
  function updateProgress() {

    var docH = document.documentElement.scrollHeight - document.documentElement.clientHeight;

  }

// ===== 导出收藏 =====
function getCollectionData() {
  var collected = [];
  aircrafts.forEach(function(a) {
    if (collection.has(a.id)) {
      collected.push({
        name: a.name,
        code: a.code,
        category: a.category,
        country: a.country,
        specs: a.specs,
        desc: a.desc,
        image: a.image,
        id: a.id
      });
    }
  });
  return collected;
}

function exportCollectionImage() {
  var data = getCollectionData();
  if (data.length === 0) { alert('收藏列表为空'); return; }

  var btn = document.getElementById('exportCollectionBtn');
  var originalHTML = btn.innerHTML;
  btn.innerHTML = '导出中...';
  btn.disabled = true;

  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var COLS = 2;
  var CARD_W = 560;
  var CARD_PADDING = 28;
  var CARD_GAP = 20;
  var PAGE_PADDING = 40;

  // Card height is dynamic: image area + text area
  var IMG_H = 260;
  var TEXT_H = 120;
  var CARD_H = IMG_H + TEXT_H;

  var cols = Math.min(COLS, data.length);
  var rows = Math.ceil(data.length / cols);
  var totalW = cols * CARD_W + (cols - 1) * CARD_GAP + PAGE_PADDING * 2;
  var totalBodyH = rows * (CARD_H + CARD_GAP) - CARD_GAP;

  var headerH = 100;
  var footerH = 50;
  var canvasW = totalW;
  var canvasH = headerH + totalBodyH + footerH + PAGE_PADDING * 2;

  var canvas = document.createElement('canvas');
  canvas.width = canvasW * dpr;
  canvas.height = canvasH * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);

  // --- Header ---
  ctx.fillStyle = '#0d2137';
  ctx.fillRect(0, 0, canvasW, headerH);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 26px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('我的收藏 \u00b7 民航客机收藏馆', PAGE_PADDING, 42);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '13px -apple-system, "PingFang SC", sans-serif';
  var todayStr = new Date().toISOString().slice(0, 10);
  ctx.fillText('共 ' + data.length + ' 架 | ' + todayStr, PAGE_PADDING, 68);

  // --- Card grid ---
  var catLabels = { civil: '民航客机', fighter: '战斗机', bomber: '轰炸机', transport: '运输机', helicopter: '直升机' };
  var specLabelMap = { cruise_speed: '巡航速度', max_speed: '最大速度', max_range: '最大航程', range: '航程', combat_radius: '作战半径', capacity: '载客量', load: '载重', wingspan: '翼展', ceiling: '升限', rotor_diameter: '旋翼直径' };

  var loadedCount = 0;
  var totalImages = data.length;
  var downloadFired = false;
  var allImagesDone = false;

  function tryDownload() {
    if (downloadFired) return;
    if (loadedCount < totalImages) return;
    allImagesDone = true;
    downloadFired = true;

    var btn = document.getElementById('exportCollectionBtn');
    if (btn) {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
    }

    // Border
    ctx.strokeStyle = '#0d2137';
    ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, canvasW, canvasH);

    // Footer
    ctx.fillStyle = '#90a4ae';
    ctx.font = '10px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('Generated: ' + todayStr, canvasW - PAGE_PADDING, canvasH - 14);
    ctx.textAlign = 'left';

    try {
      canvas.toBlob(function(blob) {
        var url = URL.createObjectURL(blob);
        var el = document.createElement('a');
        el.href = url;
        el.download = 'aviation-collection-' + todayStr + '.png';
        el.style.display = 'none';
        document.body.appendChild(el);
        el.click();
        setTimeout(function() {
          document.body.removeChild(el);
          URL.revokeObjectURL(url);
        }, 100);
      }, 'image/png');
    } catch(e) {
      alert('导出图片失败');
    }
  }

  // 8s safety timeout
  setTimeout(function() {
    if (!allImagesDone) { loadedCount = totalImages; tryDownload(); }
  }, 8000);

  data.forEach(function(item, i) {
    var row = Math.floor(i / cols);
    var col = i % cols;
    var cx = PAGE_PADDING + col * (CARD_W + CARD_GAP);
    var cy = headerH + PAGE_PADDING + row * (CARD_H + CARD_GAP);

    // Card background
    ctx.fillStyle = '#f8f9fa';
    roundRect(ctx, cx, cy, CARD_W, CARD_H, 12);
    ctx.fill();

    // Card border
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    roundRect(ctx, cx, cy, CARD_W, CARD_H, 12);
    ctx.stroke();

    // --- Image area ---
    var imgAreaH = IMG_H;
    // Placeholder gradient
    var grad = ctx.createLinearGradient(cx, cy, cx + CARD_W, cy + imgAreaH);
    var catColors = {
      civil: ['#1a3a5c', '#0d2137'],
      fighter: ['#3a1a1a', '#1a0d0d'],
      bomber: ['#2a2a3a', '#151525'],
      transport: ['#1a3a2a', '#0d1a15'],
      helicopter: ['#3a2a1a', '#1a150d']
    };
    var cc = catColors[item.category] || ['#1a2a3a', '#0d1520'];
    grad.addColorStop(0, cc[0]);
    grad.addColorStop(1, cc[1]);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(cx + 12, cy);
    ctx.lineTo(cx + CARD_W - 12, cy);
    ctx.quadraticCurveTo(cx + CARD_W, cy, cx + CARD_W, cy + 12);
    ctx.lineTo(cx + CARD_W, cy + imgAreaH);
    ctx.lineTo(cx, cy + imgAreaH);
    ctx.lineTo(cx, cy + 12);
    ctx.quadraticCurveTo(cx, cy, cx + 12, cy);
    ctx.fill();

    // Category label on image placeholder
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = 'bold 14px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(catLabels[item.category] || item.category, cx + CARD_W / 2, cy + imgAreaH / 2 + 6);
    ctx.textAlign = 'left';

    // --- Load real image ---
    var imgUrl = proxyUrl(item.image);
    if (imgUrl && imgUrl.indexOf('http') === 0 && /\.(jpg|jpeg|png|webp|gif|svg)/i.test(imgUrl)) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        // Draw image over the placeholder area
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx + 12, cy);
        ctx.lineTo(cx + CARD_W - 12, cy);
        ctx.quadraticCurveTo(cx + CARD_W, cy, cx + CARD_W, cy + 12);
        ctx.lineTo(cx + CARD_W, cy + imgAreaH);
        ctx.lineTo(cx, cy + imgAreaH);
        ctx.lineTo(cx, cy + 12);
        ctx.quadraticCurveTo(cx, cy, cx + 12, cy);
        ctx.closePath();
        ctx.clip();
        // Scale to cover
        var s = Math.max(CARD_W / img.width, imgAreaH / img.height);
        var dw = img.width * s;
        var dh = img.height * s;
        var dx = cx + (CARD_W - dw) / 2;
        var dy = cy + (imgAreaH - dh) / 2;
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
        loadedCount++;
        tryDownload();
      };
      img.onerror = function() {
        loadedCount++;
        tryDownload();
      };
      img.src = imgUrl;
    } else {
      loadedCount++;
    }

    // --- Text area ---
    var ty = cy + imgAreaH + 16;

    // Name
    ctx.fillStyle = '#1a1a2e';
    ctx.font = 'bold 16px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText(t(item.name) || item.code, cx + CARD_PADDING, ty);

    // Code + country
    ctx.fillStyle = '#607d8b';
    ctx.font = '12px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText(item.code + ' \u00b7 ' + (item.country || ''), cx + CARD_PADDING, ty + 22);

    // Description (truncated)
    ctx.fillStyle = '#78909c';
    ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
    var descText = (t(item.desc) || '').replace(/<[^>]+>/g, '').substring(0, 50);
    if (descText.length >= 50) descText += '\u2026';
    ctx.fillText(descText, cx + CARD_PADDING, ty + 42);

    // Specs line
    if (item.specs) {
      ctx.fillStyle = '#90a4ae';
      ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
      var keys = Object.keys(item.specs);
      var specsParts = [];
      keys.slice(0, 3).forEach(function(k) {
        specsParts.push((specLabelMap[k] || k) + ': ' + item.specs[k]);
      });
      ctx.fillText(specsParts.join('  |  '), cx + CARD_PADDING, ty + 62);
    }
  });

  // If all images were skipped (invalid URLs), trigger download immediately
  if (loadedCount >= totalImages) tryDownload();
}

// Round rectangle helper
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function getManufacturerIcon(code) {
  var mfr = (code || '').split(' ')[0].toLowerCase();
  var color, text;
  if (mfr === 'airbus') { color = '#0288d1'; text = 'A'; }
  else if (mfr === 'boeing') { color = '#0d47a1'; text = 'B'; }
  else if (mfr === 'comac') { color = '#c62828'; text = 'C'; }
  else if (mfr === 'embraer') { color = '#2e7d32'; text = 'E'; }
  else if (mfr === 'lockheed') { color = '#607d8b'; text = 'LM'; }
  else if (mfr === 'northrop') { color = '#546e7a'; text = 'NG'; }
  else if (mfr === '成都飞机工业集团') { color = '#c62828'; text = '成'; }
  else if (mfr === '西安飞机工业集团') { color = '#1565c0'; text = '西'; }
  else { color = '#78909c'; text = (code || '?').charAt(0).toUpperCase(); }
  return '<svg width="32" height="32" viewBox="0 0 32 32" style="flex-shrink:0"><rect width="32" height="32" rx="6" fill="' + color + '"/><text x="16" y="22" text-anchor="middle" fill="white" font-size="' + (text.length > 1 ? '11' : '14') + '" font-weight="bold" font-family="sans-serif">' + text + '</text></svg>';
}

// ===== 导出单架飞机图片 =====
function exportSingleAircraft(id) {
  var a = aircrafts.find(function(x) { return x.id === id; });
  if (!a) return;

  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var W = 600;
  var padding = 40;
  var headerH = 120;
  var bodyH = 200;
  var canvasH = headerH + bodyH + padding;

  var canvas = document.createElement('canvas');
  canvas.width = W * dpr;
  canvas.height = canvasH * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // White bg
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, canvasH);

  // Header
  ctx.fillStyle = '#0d2137';
  ctx.fillRect(0, 0, W, headerH);

  // Name
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 24px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(t(a.name) || a.code, padding, headerH/2 - 10);

  // Code + country
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '13px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(a.code + ' · ' + a.country, padding, headerH/2 + 17);

  // Specs
  var specsY = headerH + 30;
  ctx.fillStyle = '#1a1a2e';
  ctx.font = 'bold 15px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('规格参数', padding, specsY);

  var specEntries = Object.entries(a.specs || {});
  var specLabels = { cruise_speed: '巡航速度', max_speed: '最大速度', max_range: '最大航程', range: '航程', combat_radius: '作战半径', capacity: '载客量', load: '载重', wingspan: '翼展', ceiling: '升限', rotor_diameter: '旋翼直径' };
  var sx = padding, sy = specsY + 30;
  ctx.fillStyle = '#333';
  ctx.font = '13px -apple-system, "PingFang SC", sans-serif';
  specEntries.forEach(function(entry, i) {
    var col = i % 2;
    var row = Math.floor(i / 2);
    var x = sx + col * 260;
    var y = sy + row * 26;
    ctx.fillStyle = '#607d8b';
    ctx.fillText((specLabels[entry[0]] || entry[0]) + ': ', x, y);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillText(entry[1], x + 90, y);
  });

  // Border
  ctx.strokeStyle = '#0d2137';
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, W, canvasH);

  // Footer
  ctx.fillStyle = '#90a4ae';
  ctx.font = '10px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('Generated: ' + new Date().toISOString().slice(0,10), W - padding, canvasH - 12);
  ctx.textAlign = 'left';

  try {
    canvas.toBlob(function(blob) {
      var url = URL.createObjectURL(blob);
      var el = document.createElement('a');
      el.href = url;
      el.download = (t(a.name) || a.code).replace(/[\/\\:]/g, '-') + '.png';
      el.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch(e) {
    alert('导出图片失败');
  }
}

// ===== 查看次数排行 =====
var RANKING_KEY = 'aviation_view_counts';

function recordView(id) {
  try {
    var counts = JSON.parse(localStorage.getItem(RANKING_KEY) || '{}');
    counts[id] = (counts[id] || 0) + 1;
    localStorage.setItem(RANKING_KEY, JSON.stringify(counts));
  } catch(e) {}
}

function getViewCounts() {
  try {
    var counts = JSON.parse(localStorage.getItem(RANKING_KEY) || '{}');
  } catch(e) { var counts = {}; }
  var list = [];
  Object.keys(counts).forEach(function(id) {
    var a = aircrafts.find(function(x) { return x.id === parseInt(id); });
    if (a) list.push({ id: a.id, name: t(a.name), code: a.code, category: a.category, image: a.image, count: counts[id] });
  });
  list.sort(function(a, b) { return b.count - a.count; });
  return list.slice(0, 10);
}

function showRanking() {
  var list = getViewCounts();
  var rankClass = ['gold', 'silver', 'bronze'];
  var itemsHtml = '';
  if (list.length === 0) {
    itemsHtml = '<div class="ranking-empty">' + t('rankingEmpty') + '</div>';
  } else {
    list.forEach(function(item, i) {
      var rc = i < 3 ? ' ' + rankClass[i] : '';
      itemsHtml += '<div class="ranking-item" onclick="closeRanking();openDetail(' + item.id + ')">' +
        '<div class="ranking-rank' + rc + '">' + (i + 1) + '</div>' +
        '<img class="ranking-thumb" src="' + proxyUrl(item.image) + '" alt="' + item.name + '" onerror="this.style.display=\'none\'">' +
        '<div class="ranking-info">' +
          '<div class="ranking-name">' + item.name + '</div>' +
          '<div class="ranking-code">' + item.code + '</div>' +
        '</div>' +
        '<div class="ranking-count">' + item.count + ' ' + t('rankingViews') + '</div>' +
      '</div>';
    });
  }

  var overlay = document.createElement('div');
  overlay.className = 'ranking-overlay';
  overlay.id = 'rankingOverlay';
  overlay.innerHTML =
    '<div class="ranking-modal">' +
      '<button class="ranking-close" onclick="closeRanking()">&times;</button>' +
      '<h2>' + t('rankingTitle') + '</h2>' +
      '<div class="ranking-subtitle">' + t('rankingSubtitle') + '</div>' +
      itemsHtml +
      (list.length > 0 ? '<div class="ranking-clear"><a onclick="clearRanking()">' + t('rankingClear') + '</a></div>' : '') +
    '</div>';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeRanking(); });
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

function closeRanking() {
  var ov = document.getElementById('rankingOverlay');
  if (ov) { ov.remove(); }
  document.body.style.overflow = '';
}

function clearRanking() {
  if (confirm('确定清除所有排行数据？')) {
    localStorage.removeItem(RANKING_KEY);
    closeRanking();
    showRanking();
  }
}

<script>
// ===== 冷知识弹幕 =====
(function() {
  'use strict';
  var pool = (function() {
    var f = [];
    for (var i = 1; i <= 20; i++) { f.push(i18n.zh['coldFact_' + i]); }
    return f;
  })();
  var lastIdx = -1, timer = null;

  function spawn() {
    var idx;
    do { idx = Math.floor(Math.random() * pool.length); }
    while (pool.length > 1 && idx === lastIdx);
    lastIdx = idx;

    var el = document.createElement('div');
    el.className = 'cold-fact-toast';
    el.textContent = pool[idx];
    document.body.appendChild(el);
    el.addEventListener('animationend', function() { el.remove(); });

    var next = 15000 + Math.random() * 25000; /* 15~40 秒间隔 */
    timer = setTimeout(spawn, next);
  }

  /* 首页展示弹幕，详情页暂停 */
  function checkAndStart() {
    if (timer) { clearTimeout(timer); timer = null; }
    var isDetail = !!document.getElementById('detail-panel');
    if (!isDetail) { spawn(); }
  }

  checkAndStart();
  /* 通过 MutationObserver 监听 detail-panel 的出现 / 消失 */
  var obs = new MutationObserver(function() { checkAndStart(); });
  obs.observe(document.getElementById('app') || document.body, { childList: true, subtree: true, attributes: false });
})();
</script>
