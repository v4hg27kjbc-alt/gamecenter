<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临时账户绑定迁移 · HENRY AVIATION MUSEUM</title>
<meta name="robots" content="noindex,nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #16224a 0%, #0b1023 55%, #060913 100%);
    color: #e8ecf8;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 460px;
    background: rgba(20, 28, 58, .82);
    border: 1px solid rgba(120, 140, 220, .28);
    border-radius: 18px;
    padding: 30px 28px 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    backdrop-filter: blur(8px);
  }
  .emoji { font-size: 44px; text-align: center; margin-bottom: 8px; }
  h1 { font-size: 20px; text-align: center; letter-spacing: 1px; margin-bottom: 12px; }
  .notice {
    background: rgba(250, 180, 60, .12);
    border: 1px solid rgba(250, 180, 60, .35);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.7;
    color: #f7d9a0;
    margin-bottom: 18px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #9aa6d0; margin-bottom: 6px; }
  .row { display: flex; gap: 10px; }
  .input {
    flex: 1; min-width: 0;
    padding: 11px 12px;
    border: 1px solid rgba(120, 140, 220, .35);
    border-radius: 10px;
    background: rgba(8, 13, 34, .7);
    color: #e8ecf8;
    font-size: 15px;
    outline: none;
  }
  .input:focus { border-color: #4a7bff; box-shadow: 0 0 0 3px rgba(74,123,255,.18); }
  .btn {
    padding: 11px 16px;
    border: none; border-radius: 10px;
    font-size: 14px; cursor: pointer;
    transition: .15s;
    white-space: nowrap;
  }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-code { background: #2a3a72; color: #cfd9ff; }
  .btn-code:hover:not(:disabled) { background: #35488c; }
  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff; font-weight: 600; font-size: 15px;
    margin-top: 4px;
  }
  .btn-submit:hover:not(:disabled) { filter: brightness(1.12); }
  .hint { font-size: 12px; color: #7c87ad; margin-top: 8px; line-height: 1.6; }
  .status { min-height: 20px; font-size: 13px; margin-top: 12px; line-height: 1.7; }
  .status.err { color: #ff9c9c; }
  .status.good { color: #8fe3a8; }
  .foot { text-align: center; font-size: 12px; color: #6b76a0; margin-top: 16px; }
  .foot a { color: #8fa4f0; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🔧</div>
  <h1>临时账户绑定迁移</h1>
  <div class="notice">
    由于技术故障问题，原功能正在修复中，修复完成后即可正常访问。<br>
    您可先创建<strong>临时账户</strong>并绑定手机号，正式修复后即可迁移至主账户，历史信息不丢失。
  </div>

  <div class="field">
    <label>手机号</label>
    <input class="input" id="phoneInput" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" autocomplete="tel">
  </div>

  <div class="field">
    <label>短信验证码</label>
    <div class="row">
      <input class="input" id="codeInput" type="text" inputmode="numeric" maxlength="8" placeholder="6 位验证码" autocomplete="one-time-code">
      <button class="btn btn-code" id="sendBtn" type="button">获取验证码</button>
    </div>
  </div>

  <button class="btn btn-submit" id="submitBtn" type="button">创建临时账户</button>

  <div class="status" id="status"></div>
  <div class="hint">临时账户仅保存手机号与创建状态，不保存任何明文密码。成功创建后请牢记手机号，正式修复后可在后台完成迁移至主账户。</div>
  <div class="foot"><a href="/">返回主站</a> · HENRY AVIATION MUSEUM</div>
</div>

<script>
(function () {
  'use strict';
  var phoneInput = document.getElementById('phoneInput');
  var codeInput = document.getElementById('codeInput');
  var sendBtn = document.getElementById('sendBtn');
  var submitBtn = document.getElementById('submitBtn');
  var status = document.getElementById('status');
  var timer = null;
  var remain = 0;

  function setStatus(text, kind) {
    status.textContent = text || '';
    status.className = 'status' + (kind ? ' ' + kind : '');
  }
  function validPhone() { return /^1[3-9]\d{9}$/.test(phoneInput.value.trim()); }

  function startCountdown(sec) {
    remain = sec;
    sendBtn.disabled = true;
    sendBtn.textContent = remain + 's 后重发';
    timer = setInterval(function () {
      remain -= 1;
      if (remain <= 0) {
        clearInterval(timer);
        sendBtn.disabled = false;
        sendBtn.textContent = '获取验证码';
      } else {
        sendBtn.textContent = remain + 's 后重发';
      }
    }, 1000);
  }

  sendBtn.addEventListener('click', function () {
    setStatus('');
    if (!validPhone()) { setStatus('请输入正确的 11 位手机号', 'err'); return; }
    sendBtn.disabled = true;
    fetch('/api/sms-verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phoneNumber: phoneInput.value.trim() })
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; }); })
      .then(function (res) {
        if (res.j && res.j.ok === true) {
          setStatus('验证码已发送至 ' + (res.j.phoneMasked || res.j.phone || '您的手机') + '，请查收', 'good');
          startCountdown(60);
        } else {
          sendBtn.disabled = false;
          setStatus((res.j && res.j.message) || '验证码发送失败，请稍后重试', 'err');
        }
      })
      .catch(function () {
        sendBtn.disabled = false;
        setStatus('网络异常，验证码发送失败，请稍后重试', 'err');
      });
  });

  submitBtn.addEventListener('click', function () {
    setStatus('');
    if (!validPhone()) { setStatus('请输入正确的 11 位手机号', 'err'); return; }
    var code = codeInput.value.trim();
    if (!/^\d{4,8}$/.test(code)) { setStatus('请输入正确的验证码', 'err'); return; }
    submitBtn.disabled = true;
    fetch('/api/temp-account', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phoneNumber: phoneInput.value.trim(), code: code })
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; }); })
      .then(function (res) {
        submitBtn.disabled = false;
        if (res.j && res.j.ok === true) {
          setStatus('临时账户已创建，正式修复后可在后台完成迁移至主账户，请牢记手机号', 'good');
        } else {
          var msg = (res.j && res.j.message) || '创建失败，请稍后重试';
          if (res.status === 409) msg = '该手机号已有临时账户，请勿重复创建，正式修复后可直接迁移';
          setStatus(msg, 'err');
        }
      })
      .catch(function () {
        submitBtn.disabled = false;
        setStatus('网络异常，创建失败，请稍后重试', 'err');
      });
  });
})();
</script>
</body>
</html>
