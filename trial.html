<style>
  :root{
    --blue:#1f6feb; --blue-d:#1558c0; --ink:#12243a; --ink-2:#41556e;
    --line:#e3ebf5; --bg:#f6f9fd; --card:#fff; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  a{color:var(--blue);text-decoration:none}
  .wm{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;opacity:.055;
    background-repeat:repeat;background-size:260px 150px}
  .wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 20px}
  header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}

    border:1px solid #c6ebd6;border-radius:999px;padding:2px 9px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:none;border-radius:11px;padding:10px 17px;font-size:14px;font-weight:600;cursor:pointer;
    background:var(--blue);color:#fff;transition:.18s}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid #cddff8}
  .btn.ghost:hover{background:#f2f7ff}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .hero{padding:46px 0 10px}
  .hero h1{margin:0 0 12px;font-size:31px;line-height:1.3;letter-spacing:-.4px}
  .hero p.lead{margin:0 0 18px;color:var(--ink-2);font-size:15.5px;max-width:820px}
  .cards{display:grid;grid-template-columns:1.25fr .85fr;gap:16px;margin:22px 0 8px}
  @media(max-width:840px){.cards{grid-template-columns:1fr}.hero h1{font-size:24px}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
  .card h3{margin:0 0 12px;font-size:15px;letter-spacing:.2px}
  .ben{list-style:none;margin:0;padding:0}
  .ben li{position:relative;padding:7px 0 7px 24px;font-size:14.5px;color:var(--ink-2);border-bottom:1px dashed #eef3fa}
  .ben li:last-child{border-bottom:0}
  .ben li:before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:2px;
    background:var(--blue);transform:rotate(45deg)}
  .unlock{display:flex;flex-direction:column;gap:12px}
  .state{font-size:13.5px;color:var(--ink-2);background:#f4f8fe;border:1px solid #e2edfb;
    border-radius:11px;padding:10px 12px;line-height:1.6}
  .state b{color:var(--ink)}
  .reader{margin:26px 0 10px;display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
  @media(max-width:840px){.reader{grid-template-columns:1fr}}
  .toc{position:sticky;top:74px;max-height:calc(100vh - 110px);overflow:auto;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .toc .t{font-size:12px;font-weight:700;color:#7c8ea6;letter-spacing:.6px;padding:4px 8px 9px}
  .toc a{display:block;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
  .toc a:hover{background:#f2f7ff;color:var(--blue)}
  .toc a.on{background:#eaf2ff;color:var(--blue);font-weight:600}
  .toc a .lk{font-size:11px;color:#97a7bb;margin-left:4px}
  .doc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;min-height:420px}
  .doc h1{font-size:22px;margin:0 0 6px}
  .doc h2{font-size:19px;margin:28px 0 10px;padding-top:6px}
  .doc h3{font-size:16px;margin:20px 0 8px}
  .doc p{margin:9px 0;color:#26374d}
  .doc ul,.doc ol{margin:9px 0;padding-left:22px;color:#26374d}
  .doc li{margin:4px 0}
  .doc table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
  .doc th,.doc td{border:1px solid #e4ecf6;padding:8px 10px;text-align:left}
  .doc th{background:#f5f9fe;font-weight:600;color:var(--ink)}
  .doc blockquote{margin:12px 0;padding:10px 14px;background:#f7fafe;border-left:3px solid var(--blue);color:var(--ink-2)}
  .doc code{background:#f2f6fc;padding:1px 5px;border-radius:5px;font-size:13px}
  .locked{text-align:center;padding:44px 20px;color:var(--ink-2)}
  .locked h4{margin:0 0 8px;color:var(--ink);font-size:16px}
  .muted{color:#8fa1b8;font-size:13px}
  .actbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
  footer{border-top:1px solid var(--line);margin-top:34px;padding:22px 0 40px;color:#8fa1b8;font-size:12.5px;line-height:1.9}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
    background:#12243a;color:#fff;padding:10px 16px;border-radius:11px;font-size:13.5px;
    opacity:0;transition:.22s;z-index:60;pointer-events:none;max-width:88vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wm" id="wm"></div>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="dot"></span>民航客机收藏馆</div>
    <span class="badge" id="badge">试运营 · 免费解锁</span>
    <div class="sp"></div>
    <button class="btn ghost" id="btnHome">返回主站</button>
    <button class="btn" id="btnUnlock">免费解锁全文</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 id="h1">民航客机收藏馆 · 免费试运营开放中</h1>
    <p class="lead" id="lead">加载中…</p>
    <div class="cards">
      <div class="card">
        <h3>试运营期间可用的内容</h3>

      </div>

          <div class="state" id="stateBox">正在确认登录状态…</div>

    <article class="doc" id="doc">
      <div class="locked">
        <h4>深度研读内容</h4>
        <p>登录后即可免费解锁全文，试运营期间不收取任何费用。</p>
      </div>

  </section>

  <footer>
    <div id="footNotes"></div>
    <div style="margin-top:8px">© <span id="yr"></span> 民航客机收藏馆 · 试运营阶段内容，仅供个人研读。</div>
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var API='/api/trial', ACC='/api/account';
  var state={ info:null, token:'', uid:'', unlocked:false, chapters:[], trackCode:'' };

  function $(id){return document.getElementById(id);}
  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2200);}

  /* ---------- 令牌发现：遍历本地存储，兼容主站账户体系 ---------- */
  function findToken(){
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i), v=localStorage.getItem(k);
        if(typeof v==='string' && v.indexOf('v1.')===0 && v.length>40 && v.split('.').length===3){
          if(/avatar|photo|img|imgurl/.test(k.toLowerCase())) continue;
          return v;
        }
        if(typeof v==='string' && v.indexOf('"token"')>0){
          try{var o=JSON.parse(v); if(o && typeof o.token==='string' && o.token.indexOf('v1.')===0) return o.token;}catch(e){}
        }
      }
    }catch(e){}
    return '';
  }

  function api(path,opt){
    opt=opt||{};
    var h={'content-type':'application/json'};
    if(opt.token) h['authorization']='Bearer '+opt.token;
    return fetch(path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined})
      .then(function(r){return r.json().catch(function(){return {ok:false};});});
  }

  /* ---------- 水印层 ---------- */
  function paintWatermark(){
    var label=state.uid? ('民航客机收藏馆 · '+state.uid+' · 试运营阅读') : '民航客机收藏馆 · 试运营阅读';
    var d=encodeURIComponent(label);
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="260" height="150">'
      +'<text x="8" y="80" transform="rotate(-24 8 80)" fill="#1f6feb" font-size="12" '
      +'font-family="PingFang SC,Microsoft YaHei,sans-serif">'+label+'</text></svg>';
    $('wm').style.backgroundImage='url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'")';
  }

  /* ---------- 简版 Markdown 渲染 ---------- */
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    s=esc(s);
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function md2html(md){
    var lines=String(md||'').split('\n'), out=[], i=0;
    function isTableRow(l){return /^\s*\|.*\|\s*$/.test(l);}
    while(i<lines.length){
      var l=lines[i];
      if(/^\s*$/.test(l)){i++;continue;}
      var h=l.match(/^(#{1,4})\s+(.*)$/);
      if(h){out.push('<h'+h[1].length+'>'+inline(h[2].trim())+'</h'+h[1].length+'>');i++;continue;}
      if(/^\s*([-*+])\s+/.test(l)){
        out.push('<ul>');
        while(i<lines.length && /^\s*([-*+])\s+/.test(lines[i])){
          out.push('<li>'+inline(lines[i].replace(/^\s*([-*+])\s+/,''))+'</li>');i++;
        }
        out.push('</ul>');continue;
      }
      if(/^\s*\d+\.\s+/.test(l)){
        out.push('<ol>');
        while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){
          out.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>');i++;
        }
        out.push('</ol>');continue;
      }
      if(isTableRow(l) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
        var head=l.split('|').slice(1,-1).map(function(c){return c.trim();});
        i+=2;
        out.push('<table><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>');
        while(i<lines.length && isTableRow(lines[i])){
          var cells=lines[i].split('|').slice(1,-1).map(function(c){return c.trim();});
          out.push('<tr>'+cells.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>');i++;
        }
        out.push('</tbody></table>');continue;
      }
      if(/^\s*>\s?/.test(l)){
        var buf=[];
        while(i<lines.length && /^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}
        out.push('<blockquote>'+inline(buf.join(' '))+'</blockquote>');continue;
      }
      var para=[];
      while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s/.test(lines[i]) && !isTableRow(lines[i]) && !/^\s*([-*+]|\d+\.)\s/.test(lines[i]) && !/^\s*>\s?/.test(lines[i])){
        para.push(lines[i]);i++;
      }
      out.push('<p>'+inline(para.join(' '))+'</p>');
    }
    return out.join('\n');
  }

  /* ---------- 渲染 ---------- */
  function renderInfo(d){
    state.info=d;
    var tr=d.trial||{};
    $('h1').textContent=tr.headline||'民航客机收藏馆 · 免费试运营开放中';
    $('lead').textContent=tr.summary||'';
    $('badge').textContent=tr.badge||'试运营';
    var ben=$('ben'); ben.innerHTML='';
    (tr.benefits||[]).forEach(function(b){var li=document.createElement('li');li.textContent=b;ben.appendChild(li);});
    $('footNotes').innerHTML=(tr.notes||[]).map(function(n){return '· '+esc(n);}).join('<br>');
    $('yr').textContent=new Date().getFullYear();

    var toc=$('tocList'); toc.innerHTML='';
    (d.chapters||[]).forEach(function(c){
      var a=document.createElement('a');
      a.href='#ch-'+c.id; a.textContent=c.title;
      a.setAttribute('data-id',c.id);
      if(!c.free){
        var s=document.createElement('span'); s.className='lk'; s.textContent='· 解锁'; a.appendChild(s);
      }
      a.addEventListener('click',function(ev){
        if(!state.unlocked && !c.free){ ev.preventDefault(); toast('登录后可免费解锁该章节'); return; }
        var el=document.getElementById('ch-'+c.id);
        if(el){ ev.preventDefault(); el.scrollIntoView({behavior:'smooth',block:'start'}); }
      });
      toc.appendChild(a);
    });

    if(d.preview && d.preview.length){
      $('doc').innerHTML=d.preview.map(function(c){
        return '<section id="ch-'+c.id+'"><h2>'+esc(c.title)+'</h2>'+md2html(c.body)+'</section>';
      }).join('<hr style="border:0;border-top:1px solid #eef3fa;margin:26px 0">')
      + '<div class="locked" id="lockHint"><h4>后续 '+(d.locked||0)+' 个章节已锁定</h4>'
      + '<p>登录账号后免费解锁全文，试运营期间不收费。</p></div>';
    }
  }

  function renderAll(){
    state.unlocked=true;
    $('doc').innerHTML=state.chapters.map(function(c){
      return '<section id="ch-'+c.id+'"><h2>'+esc(c.title)+'</h2>'+md2html(c.body)+'</section>';
    }).join('<hr style="border:0;border-top:1px solid #eef3fa;margin:26px 0">');
    $('btnDownload').disabled=false;
    $('btnUnlock').textContent='已解锁全文';
    $('btnUnlock').disabled=true;
    $('btnUnlock2').textContent='已解锁全文';
    $('btnUnlock2').disabled=true;
    toast('已免费解锁全文');
  }

  function setState(html){ $('stateBox').innerHTML=html; }

  /* ---------- 解锁 ---------- */
  function unlock(){
    if(!state.token){ toast('请先到主站登录或注册账号'); setTimeout(function(){location.href='/';},900); return; }
    if(state.unlocked){ toast('已解锁'); return; }
    $('btnUnlock').disabled=true; $('btnUnlock').textContent='解锁中…';
    api(API,{method:'POST',body:{action:'content',token:state.token}}).then(function(r){
      if(r && r.ok){
        state.uid=r.uid||state.uid;
        state.chapters=r.chapters||[];
        paintWatermark();
        renderAll();
        track('read');
        setState('<b>已解锁</b> · UID '+esc(state.uid||'-')+'<br>免费试运营期间不限阅读次数。');
      }else{
        $('btnUnlock').disabled=false; $('btnUnlock').textContent='免费解锁全文';
        toast((r&&r.error==='login_required')?'登录已失效，请重新登录主站':'解锁失败，请稍后重试');
      }
    }).catch(function(){
      $('btnUnlock').disabled=false; $('btnUnlock').textContent='免费解锁全文';
      toast('网络异常，请稍后重试');
    });
  }

  function track(kind){
    return api(API,{method:'POST',body:{action:'track',kind:kind,token:state.token,ref:location.href}})
      .then(function(r){ if(r&&r.ok) state.trackCode=r.code; return r; }).catch(function(){return null;});
  }

  /* ---------- 下载：自包含 HTML，带溯源码水印 ---------- */
  function buildDownloadHtml(code){
    var uid=state.uid||'未登录';
    var ds=new Date().toLocaleString('zh-CN',{hour12:false});
    var body=state.chapters.map(function(c){return '<section><h2>'+esc(c.title)+'</h2>'+md2html(c.body)+'</section>';}).join('');
    var wm='民航客机收藏馆 · '+uid+' · '+code+' · 禁止外传';
    var mark='<div style="position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:.06;'
      +'background-repeat:repeat;background-size:280px 160px;z-index:0;background-image:url(&quot;data:image/svg+xml;charset=utf-8,'
      +encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="280" height="160"><text x="6" y="86" transform="rotate(-24 6 86)" fill="#1f6feb" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif">'+wm+'</text></svg>')
      +'&quot;)"></div>';
    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">'
      +'<title>'+esc(state.info&&state.info.doc?state.info.doc.title:'深度研读')+'</title>'
      +'<style>body{max-width:860px;margin:36px auto;padding:0 22px;'
      +'font:15px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#12243a;position:relative}'
      +'h1{font-size:23px}h2{font-size:19px;margin-top:30px;border-top:1px solid #eef3fa;padding-top:16px}'
      +'h3{font-size:16px}table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px}'
      +'th,td{border:1px solid #e4ecf6;padding:7px 9px;text-align:left}th{background:#f5f9fe}'
      +'blockquote{margin:12px 0;padding:9px 14px;background:#f7fafe;border-left:3px solid #1f6feb;color:#41556e}'
      +'code{background:#f2f6fc;padding:1px 5px;border-radius:5px}'
      +'.hdr{border-bottom:2px solid #1f6feb;padding-bottom:12px;margin-bottom:8px}'
      +'.hdr .b{font-weight:700;font-size:17px}.hdr .m{color:#7c8ea6;font-size:12.5px;margin-top:6px;line-height:1.8}'
      +'.ftr{margin-top:40px;border-top:1px solid #eef3fa;padding-top:14px;color:#8fa1b8;font-size:12px;line-height:1.9}'
      +'@media print{.wm{position:fixed}}</style></head><body>'
      +mark
      +'<div style="position:relative;z-index:1">'
      +'<div class="hdr"><div class="b">民航客机收藏馆 · 深度研读资料</div>'
      +'<div class="m">下载账号：'+esc(uid)+' ｜ 溯源码：'+esc(code)+' ｜ 生成时间：'+esc(ds)+'<br>'
      +'本文档处于免费试运营阶段，仅供个人研读，未经授权不得转载、二次分发或用于商业用途。</div></div>'
      +body
      +'<div class="ftr">溯源码 '+esc(code)+' 已在服务端登记，可与账号对应核验来源。'
      +'如发现未授权传播，可凭该溯源码定位分发源头。<br>© '+new Date().getFullYear()+' 民航客机收藏馆</div>'
      +'</div></body></html>';
  }

  function download(){
    if(!state.unlocked){ toast('请先解锁全文'); return; }
    $('btnDownload').disabled=true; $('btnDownload').textContent='生成中…';
    track('download').then(function(r){
      var code=(r&&r.code)?r.code:('TR-'+Date.now().toString(36).toUpperCase());
      var html=buildDownloadHtml(code);
      var blob=new Blob([html],{type:'text/html;charset=utf-8'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='民航客机收藏馆_C919深度研读_'+code+'.html';
      document.body.appendChild(a); a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
      $('btnDownload').disabled=false; $('btnDownload').textContent='下载带溯源水印版本';
      toast('已生成带溯源码 '+code+' 的文件');
    });
  }

  /* ---------- 启动 ---------- */
  function boot(){
    $('btnHome').addEventListener('click',function(){ location.href='/'; });
    $('btnUnlock').addEventListener('click',unlock);
    $('btnUnlock2').addEventListener('click',unlock);
    $('btnDownload').addEventListener('click',download);
    paintWatermark();

    api(API+'?action=info').then(function(d){
      if(d && d.ok) renderInfo(d);
      else{ $('lead').textContent='试运营信息加载失败，请稍后刷新重试。'; }
    }).catch(function(){ $('lead').textContent='试运营信息加载失败，请检查网络后刷新。'; });

    state.token=findToken();
    if(!state.token){
      setState('<b>尚未登录</b> · 请返回主站登录或注册账号，即可免费解锁全文。');
      $('btnUnlock2').textContent='去主站登录/注册';
      $('btnUnlock2').onclick=function(){ location.href='/'; };
      return;
    }
    api(ACC,{method:'POST',token:state.token,body:{action:'profile'}}).then(function(r){
      if(r && r.ok && r.profile){
        state.uid=r.profile.uid||'';
        setState('<b>已登录</b> · '+esc(r.profile.displayName||r.profile.username||'用户')+'<br>UID '+esc(state.uid)+' · 可免费解锁全文');
        paintWatermark();
        $('btnUnlock2').textContent='免费解锁全文';
        unlock();
      }else{
        state.token='';
        setState('<b>登录状态已失效</b> · 请返回主站重新登录后解锁。');
        $('btnUnlock2').textContent='去主站登录/注册';
        $('btnUnlock2').onclick=function(){ location.href='/'; };
      }
    }).catch(function(){
      setState('<b>登录状态未知</b> · 点击右侧按钮尝试解锁。');
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
</body>
</html>
