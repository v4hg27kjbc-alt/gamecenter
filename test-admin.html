<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; color: #333; min-height: 100vh; transition: background .4s, color .4s; }
.header { background: #fff; border-bottom: 1px solid #eee; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; transition: background .4s, border-color .4s; }
.header h1 { font-size: 20px; font-weight: 600; }
.theme-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: transparent; cursor: pointer; font-size: 13px; transition: all .2s; color: inherit; }
.theme-btn:hover { background: rgba(0,0,0,.05); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid #eee; padding: 0 24px; transition: border-color .4s; }
.tab { padding: 12px 20px; cursor: pointer; font-size: 14px; color: #999; border-bottom: 2px solid transparent; transition: all .2s; user-select: none; }
.tab.active { color: #333; border-bottom-color: #4a90d9; font-weight: 500; }
.tab:hover:not(.active) { color: #555; }
.content { padding: 24px; max-width: 800px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }

/* 卡片 */
.sms-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 24px; margin-bottom: 20px; transition: background .4s, border-color .4s, box-shadow .4s; }
.sms-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.form-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.input { flex: 1; height: 40px; border: 1px solid #ddd; border-radius: 6px; padding: 0 12px; font-size: 14px; outline: none; transition: all .2s; }
.input:focus { border-color: #4a90d9; }
.btn { height: 40px; padding: 0 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all .2s; white-space: nowrap; }
.btn-primary { background: #4a90d9; color: #fff; }
.btn-primary:hover { background: #3a7bc8; }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-ghost { background: transparent; color: #4a90d9; border: 1px solid #ddd; }
.btn-ghost:hover { background: #f5f8fc; }
.code-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.msg { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-top: 12px; display: none; }
.msg.success { display: block; background: #e8f5e9; color: #2e7d32; }
.msg.error { display: block; background: #ffebee; color: #c62828; }
.log-area { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 12px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.8; transition: background .4s, border-color .4s; }
.log-entry { padding: 2px 0; border-bottom: 1px dashed #eee; }
.log-time { color: #999; }

/* 小恐龙 */
.dino-canvas-wrap { text-align: center; margin-bottom: 20px; }
#dinoCanvas { border: 1px solid #ddd; border-radius: 4px; background: #fff; touch-action: none; }
.dino-hint { font-size: 12px; color: #999; margin-top: 8px; }

/* 用户列表 */
.user-table { width: 100%; border-collapse: collapse; }
.user-table th, .user-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
.user-table th { background: #fafafa; font-weight: 500; color: #666; position: sticky; top: 0; }
.user-table tr:hover td { background: #fafafa; }
.empty-tip { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }

/* ===== 主题：深色 ===== */
body.dark { background: #1a1a2e; color: #e0e0e0; }
body.dark .header { background: #16213e; border-color: #2a2a4a; }
body.dark .tabs { border-color: #2a2a4a; }
body.dark .tab.active { color: #e0e0e0; border-bottom-color: #e94560; }
body.dark .sms-card { background: #16213e; border-color: #2a2a4a; }
body.dark .input { background: #0f3460; border-color: #2a2a4a; color: #e0e0e0; }
body.dark .input:focus { border-color: #e94560; }
body.dark .btn-primary { background: #e94560; }
body.dark .btn-primary:hover { background: #c73650; }
body.dark .btn-ghost { color: #e94560; border-color: #2a2a4a; }
body.dark .btn-ghost:hover { background: rgba(233,69,96,.1); }
body.dark .log-area { background: #0f3460; border-color: #2a2a4a; }
body.dark .log-entry { border-color: #2a2a4a; }
body.dark .user-table th { background: #0f3460; color: #aaa; }
body.dark .user-table td { border-color: #2a2a4a; }
body.dark .user-table tr:hover td { background: #0f3460; }
body.dark .empty-tip { color: #666; }
body.dark #dinoCanvas { background: #16213e; border-color: #2a2a4a; }

/* ===== 主题：渐变紫蓝 ===== */
body.gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
body.gradient .header { background: rgba(255,255,255,.1); backdrop-filter: blur(10px); border-color: rgba(255,255,255,.15); }
body.gradient .tabs { border-color: rgba(255,255,255,.15); }
body.gradient .tab { color: rgba(255,255,255,.7); }
body.gradient .tab.active { color: #fff; border-bottom-color: #fff; }
body.gradient .sms-card { background: rgba(255,255,255,.12); backdrop-filter: blur(10px); border-color: rgba(255,255,255,.2); }
body.gradient .input { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.25); color: #fff; }
body.gradient .input::placeholder { color: rgba(255,255,255,.5); }
body.gradient .input:focus { border-color: rgba(255,255,255,.6); }
body.gradient .btn-primary { background: rgba(255,255,255,.25); backdrop-filter: blur(5px); color: #fff; }
body.gradient .btn-primary:hover { background: rgba(255,255,255,.35); }
body.gradient .btn-primary:disabled { background: rgba(255,255,255,.1); color: rgba(255,255,255,.4); }
body.gradient .btn-ghost { color: #fff; border-color: rgba(255,255,255,.3); }
body.gradient .btn-ghost:hover { background: rgba(255,255,255,.15); }
body.gradient .msg.success { background: rgba(46,125,50,.3); color: #b9f6ca; }
body.gradient .msg.error { background: rgba(198,40,40,.3); color: #ffcdd2; }
body.gradient .log-area { background: rgba(0,0,0,.15); border-color: rgba(255,255,255,.1); color: rgba(255,255,255,.8); }
body.gradient .log-entry { border-color: rgba(255,255,255,.08); }
body.gradient .log-time { color: rgba(255,255,255,.4); }
body.gradient .user-table th { background: rgba(0,0,0,.15); color: rgba(255,255,255,.6); }
body.gradient .user-table td { border-color: rgba(255,255,255,.1); }
body.gradient .user-table tr:hover td { background: rgba(255,255,255,.05); }
body.gradient .empty-tip { color: rgba(255,255,255,.4); }
body.gradient #dinoCanvas { background: rgba(0,0,0,.2); border-color: rgba(255,255,255,.2); }

/* ===== 主题：暖色日落 ===== */
body.sunset { background: linear-gradient(to bottom, #ffecd2 0%, #fcb69f 100%); color: #333; }
body.sunset .header { background: rgba(255,255,255,.7); backdrop-filter: blur(10px); border-color: rgba(0,0,0,.08); }
body.sunset .tabs { border-color: rgba(0,0,0,.08); }
body.sunset .tab { color: #888; }
body.sunset .tab.active { color: #333; border-bottom-color: #e67e22; }
body.sunset .sms-card { background: rgba(255,255,255,.75); backdrop-filter: blur(10px); border-color: rgba(0,0,0,.08); }
body.sunset .input { background: rgba(255,255,255,.6); border-color: rgba(0,0,0,.1); color: #333; }
body.sunset .input:focus { border-color: #e67e22; }
body.sunset .btn-primary { background: #e67e22; }
body.sunset .btn-primary:hover { background: #d35400; }
body.sunset .btn-ghost { color: #e67e22; border-color: rgba(0,0,0,.1); }
body.sunset .btn-ghost:hover { background: rgba(230,126,34,.1); }
body.sunset .msg.success { background: rgba(46,125,50,.15); color: #2e7d32; }
body.sunset .msg.error { background: rgba(198,40,40,.15); color: #c62828; }
body.sunset .log-area { background: rgba(255,255,255,.5); border-color: rgba(0,0,0,.08); }
body.sunset .log-entry { border-color: rgba(0,0,0,.06); }
body.sunset .log-time { color: #999; }
body.sunset .user-table th { background: rgba(255,255,255,.5); color: #666; }
body.sunset .user-table td { border-color: rgba(0,0,0,.06); }
body.sunset .user-table tr:hover td { background: rgba(255,255,255,.4); }
body.sunset .empty-tip { color: #bbb; }
body.sunset #dinoCanvas { background: rgba(255,255,255,.6); border-color: rgba(0,0,0,.1); }

/* ===== 主题：赛博朋克 ===== */
body.cyber { background: #0a0a1a; color: #0ff; }
body.cyber .header { background: #0a0a1a; border-color: #0ff; box-shadow: 0 0 20px rgba(0,255,255,.1); }
body.cyber .header h1 { text-shadow: 0 0 10px #0ff; }
body.cyber .tabs { border-color: #0ff; }
body.cyber .tab { color: #0aa; }
body.cyber .tab.active { color: #0ff; border-bottom-color: #0ff; text-shadow: 0 0 8px #0ff; }
body.cyber .sms-card { background: rgba(0,255,255,.03); border-color: #0ff; box-shadow: 0 0 15px rgba(0,255,255,.08), inset 0 0 30px rgba(0,255,255,.02); }
body.cyber .sms-card h2 { text-shadow: 0 0 8px #0ff; }
body.cyber .input { background: rgba(0,255,255,.05); border-color: #0ff; color: #0ff; }
body.cyber .input:focus { border-color: #0ff; box-shadow: 0 0 10px rgba(0,255,255,.3); }
body.cyber .btn-primary { background: #0ff; color: #0a0a1a; font-weight: bold; }
body.cyber .btn-primary:hover { background: #0cc; box-shadow: 0 0 15px rgba(0,255,255,.4); }
body.cyber .btn-primary:disabled { background: #0aa; color: #0a0a1a; }
body.cyber .btn-ghost { color: #0ff; border-color: #0ff; }
body.cyber .btn-ghost:hover { background: rgba(0,255,255,.1); box-shadow: 0 0 10px rgba(0,255,255,.2); }
body.cyber .msg.success { background: rgba(0,255,255,.1); color: #0ff; border: 1px solid rgba(0,255,255,.3); }
body.cyber .msg.error { background: rgba(255,0,100,.1); color: #ff0064; border: 1px solid rgba(255,0,100,.3); }
body.cyber .log-area { background: rgba(0,255,255,.02); border-color: #0ff; }
body.cyber .log-entry { border-color: rgba(0,255,255,.1); }
body.cyber .log-time { color: #0aa; }
body.cyber .user-table th { background: rgba(0,255,255,.05); color: #0ff; border-color: #0ff; }
body.cyber .user-table td { border-color: rgba(0,255,255,.1); }
body.cyber .user-table tr:hover td { background: rgba(0,255,255,.05); }
body.cyber .empty-tip { color: #0aa; }
body.cyber #dinoCanvas { background: rgba(0,255,255,.03); border-color: #0ff; box-shadow: 0 0 10px rgba(0,255,255,.1); }
</style>
</head>
<body>

<div class="header">
  <h1>测试后台</h1>
  <div style="display:flex;gap:6px;align-items:center;">
    <span style="font-size:12px;color:#999;margin-right:4px;">皮肤</span>
    <button class="theme-btn" onclick="setTheme('')">纯白</button>
    <button class="theme-btn" onclick="setTheme('dark')">深色</button>
    <button class="theme-btn" onclick="setTheme('gradient')">紫蓝</button>
    <button class="theme-btn" onclick="setTheme('sunset')">日落</button>
    <button class="theme-btn" onclick="setTheme('cyber')">赛博</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="sms">短信收发</div>
  <div class="tab" data-tab="game">小恐龙游戏</div>
  <div class="tab" data-tab="users">注册用户</div>
</div>

<div class="content">
  <!-- 短信面板 -->
  <div id="panel-sms" class="panel active">
    <div class="sms-card">
      <h2>发送验证码</h2>
      <div class="form-row">
        <input type="tel" class="input" id="phoneInput" placeholder="输入手机号" maxlength="11">
        <button class="btn btn-primary" id="sendBtn" onclick="sendCode()">获取验证码</button>
      </div>
      <div class="code-row">
        <input type="text" class="input" id="codeInput" placeholder="输入验证码" maxlength="6">
        <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登录</button>
      </div>
      <div id="msgBox" class="msg"></div>
    </div>
    <div class="sms-card">
      <h2>操作日志</h2>
      <div class="log-area" id="logArea"></div>
    </div>
  </div>

  <!-- 小恐龙 -->
  <div id="panel-game" class="panel">
    <div class="sms-card">
      <h2>小恐龙游戏</h2>
      <div class="dino-canvas-wrap">
        <canvas id="dinoCanvas" width="600" height="200"></canvas>
      </div>
      <p class="dino-hint">按空格键或点击屏幕跳跃 · 躲避障碍物</p>
      <div style="text-align:center;margin-top:12px;">
        <button class="btn btn-ghost" onclick="resetGame()">重新开始</button>
      </div>
    </div>
  </div>

  <!-- 用户列表 -->
  <div id="panel-users" class="panel">
    <div class="sms-card">
      <h2>注册用户列表</h2>
      <table class="user-table" id="userTable">
        <thead><tr><th>#</th><th>手机号</th><th>密码</th><th>注册时间</th></tr></thead>
        <tbody id="userBody"></tbody>
      </table>
      <div id="emptyTip" class="empty-tip">暂无注册用户</div>
    </div>
  </div>
</div>

<script>
// ===== 主题切换 =====
function setTheme(name) {
  document.body.className = name;
  localStorage.setItem('test_theme', name);
}
(function() {
  var saved = localStorage.getItem('test_theme');
  if (saved) document.body.className = saved;
})();

// ===== Tab 切换 =====
document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(x) { x.classList.remove('active'); });
    t.classList.add('active');
    document.getElementById('panel-' + t.dataset.tab).classList.add('active');
  });
});

// ===== 工具函数 =====
function showMsg(text, type) {
  var b = document.getElementById('msgBox');
  b.textContent = text;
  b.className = 'msg ' + type;
}
function addLog(text) {
  var area = document.getElementById('logArea');
  var now = new Date();
  var time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
  var entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = '<span class="log-time">' + time + '</span> ' + escHtml(text);
  area.insertBefore(entry, area.firstChild);
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== 短信收发 =====
var sendTimer = null;
async function sendCode() {
  var phone = document.getElementById('phoneInput').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) { showMsg('请输入正确的手机号', 'error'); return; }
  var btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = '等待中...';
  try {
    var res = await fetch('/api/sms-verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phoneNumber: phone })
    });
    var data = await res.json();
    if (data.ok) {
      showMsg('验证码已发送至 ' + phone.slice(0,3) + '****' + phone.slice(7), 'success');
      addLog('发送成功 → ' + phone);
      // 倒计时
      var sec = 60;
      sendTimer = setInterval(function() {
        btn.textContent = sec + 's';
        if (sec <= 0) { clearInterval(sendTimer); btn.disabled = false; btn.textContent = '获取验证码'; }
        sec--;
      }, 1000);
    } else {
      showMsg(data.message || '发送失败', 'error');
      addLog('发送失败 → ' + (data.error || ''));
    }
  } catch(e) {
    showMsg('网络错误: ' + e.message, 'error');
    addLog('网络错误 → ' + e.message);
  } finally {
    if (!sendTimer) { btn.disabled = false; btn.textContent = '获取验证码'; }
  }
}

// ===== 登录 & 注册 =====
function doLogin() {
  var phone = document.getElementById('phoneInput').value.trim();
  var code = document.getElementById('codeInput').value.trim();
  if (!phone || !code) { showMsg('请填写手机号和验证码', 'error'); return; }
  // 模拟登录成功
  var pwd = Math.random().toString(36).slice(-8).toUpperCase();
  var users = JSON.parse(localStorage.getItem('test_users') || '[]');
  users.push({ phone: phone, password: pwd, time: new Date().toLocaleString() });
  localStorage.setItem('test_users', JSON.stringify(users));
  showMsg('登录成功！密码: ' + pwd, 'success');
  addLog('新用户注册 → ' + phone + ' 密码:' + pwd);
  renderUsers();
  // 清空验证码框
  document.getElementById('codeInput').value = '';
}

// ===== 用户列表 =====
function renderUsers() {
  var users = JSON.parse(localStorage.getItem('test_users') || '[]');
  var tbody = document.getElementById('userBody');
  var empty = document.getElementById('emptyTip');
  if (users.length === 0) { tbody.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  tbody.innerHTML = users.map(function(u, i) {
    return '<tr><td>' + (i+1) + '</td><td>' + escHtml(u.phone) + '</td><td>' + escHtml(u.password) + '</td><td>' + escHtml(u.time) + '</td></tr>';
  }).join('');
}

// ===== 小恐龙游戏 =====
var dino = null;
function initDino() {
  var canvas = document.getElementById('dinoCanvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var groundY = H - 30;
  var gravity = 0.6;
  var jumpForce = -12;
  var speed = 4;
  var obstacles = [];
  var score = 0;
  var gameOver = false;
  var frameCount = 0;

  var dino = { x: 60, y: groundY, w: 30, h: 40, vy: 0, jumping: false };

  function spawnObstacle() {
    var h = 20 + Math.random() * 25;
    obstacles.push({ x: W, w: 15 + Math.random() * 10, h: h, ground: true });
  }

  function update() {
    if (gameOver) return;
    frameCount++;
    // 重力
    if (dino.jumping) {
      dino.vy += gravity;
      dino.y += dino.vy;
      if (dino.y >= groundY) { dino.y = groundY; dino.vy = 0; dino.jumping = false; }
    }
    // 障碍物
    if (frameCount % 90 === 0) spawnObstacle();
    for (var i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= speed;
      if (obstacles[i].x + obstacles[i].w < 0) { obstacles.splice(i, 1); continue; }
      // 碰撞检测
      if (dino.x + dino.w > obstacles[i].x && dino.x < obstacles[i].x + obstacles[i].w &&
          dino.y > groundY - obstacles[i].h) {
        gameOver = true;
        addLog('游戏结束！得分: ' + score);
      }
    }
    score++;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // 地面线
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    // 恐龙
    ctx.fillStyle = '#333';
    ctx.fillRect(dino.x, dino.y - dino.h, dino.w, dino.h);
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.fillRect(dino.x + 20, dino.y - dino.h + 8, 5, 5);
    // 障碍物
    ctx.fillStyle = '#c62828';
    obstacles.forEach(function(o) {
      ctx.fillRect(o.x, groundY - o.h, o.w, o.h);
    });
    // 分数
    ctx.fillStyle = '#999';
    ctx.font = '14px monospace';
    ctx.fillText('Score: ' + score, W - 100, 20);
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', W/2, H/2);
      ctx.textAlign = 'left';
    }
  }

  function loop() {
    update(); draw();
    requestAnimationFrame(loop);
  }

  function jump() {
    if (!dino.jumping && !gameOver) {
      dino.vy = jumpForce;
      dino.jumping = true;
    }
  }

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space') { e.preventDefault(); jump(); }
  });
  canvas.addEventListener('click', jump);
  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); jump(); }, { passive: false });

  window.resetGame = function() {
    obstacles = []; score = 0; frameCount = 0; gameOver = false;
    dino.y = groundY; dino.vy = 0; dino.jumping = false;
  };

  loop();
}

// ===== 初始化 =====
renderUsers();
initDino();
</script>
</body>
</html>
