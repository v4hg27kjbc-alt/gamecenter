<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阅读 · 波音737系列综合研究报告 | 民航客机收藏馆</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;background:#f6f8fc;color:#1f2937;line-height:1.85}
  .wrap{max-width:860px;margin:0 auto;padding:26px 18px 80px}
  .gate{background:#fff;border:1px solid #e5eaf3;border-radius:16px;padding:26px;max-width:560px;margin:8vh auto;box-shadow:0 4px 20px rgba(15,23,42,.05)}
  .gate h1{font-size:20px;margin-bottom:8px;color:#0f172a}
  .gate p{font-size:13.5px;color:#64748b;margin-bottom:16px}
  input{width:100%;padding:13px 14px;border:1px solid #d7dfec;border-radius:10px;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;outline:none}
  input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.14)}
  button{width:100%;margin-top:12px;border:0;border-radius:11px;padding:14px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);cursor:pointer}
  button:disabled{opacity:.55}
  .err{color:#b91c1c;font-size:13px;margin-top:10px;min-height:18px}
  .doc{background:#fff;border:1px solid #e5eaf3;border-radius:16px;padding:34px 30px}
  .doc h1{font-size:24px;margin:6px 0 18px;color:#0f172a}
  .doc h2{font-size:18px;margin:26px 0 10px;padding-left:10px;border-left:4px solid #667eea;color:#1e293b}
  .doc h3{font-size:15px;margin:20px 0 8px;color:#334155}
  .doc p{margin-bottom:12px;font-size:14.5px;color:#334155}
  .doc ul,.doc ol{margin:0 0 14px 22px}
  .doc li{margin-bottom:6px;font-size:14.5px;color:#334155}
  .doc blockquote{background:#f0f7ff;border-left:4px solid #93c5fd;border-radius:0 10px 10px 0;padding:12px 16px;margin:0 0 22px;font-size:13px;color:#1e40af}
  .doc code{background:#eef2f7;border-radius:5px;padding:1px 5px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
  .doc table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:13.5px}
  .doc th,.doc td{border:1px solid #e2e8f0;padding:8px 10px;text-align:left}
  .doc th{background:#f8fafc;font-weight:600}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:12.5px;color:#64748b;flex-wrap:wrap;gap:8px}
  .bar b{color:#1e293b}
  .tag{background:#ecfdf5;color:#047857;border-radius:20px;padding:3px 11px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div id="gateView" class="gate">
    <h1>输入券码或订单号开始阅读</h1>
    <p>波音 737 系列综合研究报告 · 付费文档（含追踪码）</p>
    <input id="code" placeholder="GC-XXXX-XXXX 或 ORD-YYYYMMDD-XXXXXX" autocomplete="off">
    <button id="go">验证并阅读</button>
    <div class="err" id="err"></div>
    <p style="margin-top:16px;font-size:12.5px">兑换码只显示一遍，忘记也没关系：登录后到「我的 → 我购买的商品」点「进入阅读」即可。</p>
    <p style="margin-top:8px;font-size:12.5px"><a href="/pay/737.html" style="color:#4f46e5;text-decoration:none">还没有券码？¥5 购买 →</a></p>
  </div>

  <div id="docView" style="display:none">
    <div class="bar">
      <span><b id="docTitle">—</b></span>
      <span class="tag" id="traceTag">追踪码 —</span>
    </div>
    <div class="doc" id="docBody"></div>
  </div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 极简 Markdown 渲染（标题/段落/列表/引用/表格/粗体/行内代码）
function md(src) {
  var lines = String(src).replace(/\r/g, '').split('\n');
  var out = [], i = 0, inQuote = false, listType = null;
  function closeList() { if (listType) { out.push(listType === 'ul' ? '</ul>' : '</ol>'); listType = null; } }
  function inline(t) {
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#4f46e5">$1</a>');
    return t;
  }
  while (i < lines.length) {
    var ln = lines[i];
    // 表格
    if (/^\s*\|/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      closeList();
      var head = ln.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); });
      i += 2;
      var rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }));
        i++;
      }
      out.push('<table><thead><tr>' + head.map(function (h) { return '<th>' + inline(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
      continue;
    }
    var h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
    if (/^\s*>\s?/.test(ln)) {
      closeList();
      var q = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + q.map(inline).join('<br>') + '</blockquote>');
      continue;
    }
    if (/^\s*[-*+]\s+/.test(ln)) {
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + inline(ln.replace(/^\s*[-*+]\s+/, '')) + '</li>'); i++; continue;
    }
    if (/^\s*\d+[.)]\s+/.test(ln)) {
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + inline(ln.replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); i++; continue;
    }
    if (!ln.trim()) { closeList(); i++; continue; }
    closeList();
    out.push('<p>' + inline(ln) + '</p>'); i++;
  }
  closeList();
  return out.join('\n');
}

function load(code, order) {
  $('err').textContent = '';
  var btn = $('go');
  btn.disabled = true; btn.textContent = '验证中…';
  fetch('/api/project-doc', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code || '', order: order || '', project: 'b737' })
  }).then(function (r) { return r.json(); }).then(function (d) {
    btn.disabled = false; btn.textContent = '验证并阅读';
    if (!d.ok) { $('err').textContent = d.message || '验证失败'; return; }
    $('gateView').style.display = 'none';
    $('docView').style.display = 'block';
    $('docTitle').textContent = d.title || '';
    $('traceTag').textContent = '追踪码 ' + (d.traceCode || '');
    $('docBody').innerHTML = md(d.markdown || '');
    window.scrollTo(0, 0);
  }).catch(function () {
    btn.disabled = false; btn.textContent = '验证并阅读';
    $('err').textContent = '网络异常，请稍后重试';
  });
}

$('go').addEventListener('click', function () {
  var c = ($('code').value || '').trim().toUpperCase().replace(/\s/g, '');
  if (c.length < 6) { $('err').textContent = '请输入完整的券码或订单号'; return; }
  if (/^ORD-/i.test(c)) load('', c);
  else load(c);
});
$('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });

(function () {
  var q = new URLSearchParams(location.search);
  var od = q.get('order');
  if (od) { $('code').value = od; load('', od.toUpperCase()); return; }
  var c = q.get('code');
  if (c) { $('code').value = c; load(c.toUpperCase()); }
})();
</script>
</body>
</html>
